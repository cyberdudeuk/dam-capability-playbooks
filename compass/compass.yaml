# Compass 1.3: what this is, in plain words, and why it is called what it is (assessed 12 November 2026)
about:
  what: A free guide to four public websites about looking after data in the public sector. It points you to the right page, in the right order.
  for_whom: Anyone in the public sector who works with data. You do not need to know anything about data management first.
  aims:
  - Find the right page first time
  - Do things in a sensible order, starting with what is required
  - See how the four websites fit together
  - Build and share your own list of things to do
  not:
  - It is not official government guidance
  - It does not collect or send any of your data
  - It does not rank the four websites
releases:
- version: 2.0.0
  date: '2026-11-13'
  summary: New ways in, a directory and plainer wording
  changes:
  - {flag: new, tab: start, text: "A start page with four ways in and one search box"}
  - {flag: new, tab: roles, text: "Start from your job: nine groups of professions, each with their tasks, topics, guidance and communities"}
  - {flag: new, tab: directory, sub: dir-sub, text: "A directory of every website, page, standard, law and community the four websites point to"}
  - {flag: updated, tab: directory, sub: portals, subs: [when, links], text: "The four websites, when to use which and how they link now sit in the directory"}
