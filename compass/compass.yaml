# Words used on this page, in plain English. Each has other names people use (the thesaurus), a broader term where useful, and related terms.
glossary:
- {id: portal, term: Portal, def: "A website that brings together guidance, tools and information on one subject, with its own front page and navigation.", also: [website, hub, site], related: [estate]}
- {id: estate, term: Estate, def: "All the websites, systems, data or code that an organisation or programme looks after, taken together.", also: ["data estate", "code estate", "IT estate", "landscape"], related: [portal]}
- {id: compass, term: Compass and bearing, def: "The guide's picture of the four portals as four directions. Your bearing is the portal the guide suggests you start from.", also: [direction, "starting point"], related: [wayfinder, route]}
- {id: wayfinder, term: Wayfinder, def: "The four questions on the By task tab. Your answers produce a suggested route.", also: [questionnaire, "route finder"], related: [route, pathway]}
- {id: route, term: Route, def: "An ordered list of steps across the portals that the guide suggests for your situation.", also: [journey, "suggested path"], related: [wayfinder, pathway]}
- {id: pathway, term: Pathway, def: "Your own ordered list of activities, which you build yourself on the My pathway tab. It is kept only in the page address.", also: ["my pathway", "personal plan", "to-do list"], related: [route, activity]}
- {id: dam, term: DAM Policy, def: "The Data Asset Management Policy: UK government's policy on how departments and arm's-length bodies identify, own, describe and manage the quality of their most important data.", also: ["data asset management policy"], related: [cda, owner]}
- {id: cda, term: Critical data asset, def: "A set of data that an organisation or the public depends on, and so must have a named owner, a catalogue record and a data quality plan under the DAM Policy.", also: [CDA, "critical data"], broader: "Data asset", related: [dam, catalogue]}
- {id: owner, term: Data owner, def: "The senior person accountable for a data asset: who uses it, how good it must be and who can see it. Often also the information asset owner, who answers for its security and records.", also: ["business owner"], related: [steward, raci]}
- {id: steward, term: Data steward, def: "The person who looks after a data asset day to day for its owner: its definitions, quality and records.", also: ["data custodian (sometimes)"], related: [owner]}
- {id: catalogue, term: Data catalogue, def: "A searchable list of an organisation's data assets, with a description of each so people can find and judge them.", also: ["data inventory", "information asset register"], related: [metadata, dcat]}
- {id: metadata, term: Metadata, def: "Information that describes data, such as its title, owner, how often it is updated and who can use it.", also: ["data about data", "catalogue record"], related: [catalogue, dcat]}
- {id: dq, term: Data quality, def: "How fit data is for the purpose it is used for: for example whether it is complete, accurate, consistent and up to date.", also: ["fitness for use"], related: [dqap]}
- {id: dqap, term: Data quality action plan, def: "A plan for one data asset that sets out how good it needs to be, how that is measured and what is being done to improve it.", also: [DQAP], broader: "Data quality", related: [dq, dam]}
- {id: dama, term: DAMA wheel, def: "A diagram by DAMA International, a professional body for data management, that shows the areas of data management around data governance at the centre.", also: ["DAMA-DMBOK wheel", "data management wheel"], related: [dmbok, area]}
- {id: dmbok, term: DMBOK, def: "The Data Management Body of Knowledge: DAMA International's guide to data management practice, organised into knowledge areas.", also: ["DAMA-DMBOK"], related: [dama, area]}
- {id: area, term: Data management area, def: "One of the parts of data management on the DAMA wheel, such as data quality or metadata management.", also: ["knowledge area", "discipline"], broader: "Data management", related: [dama, capability]}
- {id: governance, term: Data governance, def: "Deciding who is responsible for data, who can make which decisions about it, and checking that those decisions are followed.", also: ["data stewardship (broadly)"], related: [owner, area]}
- {id: capability, term: Capability, def: "Something an organisation needs to be able to do well to manage its data, such as naming owners or measuring quality. The DAM playbooks list 32.", also: ["capability area", "competence"], related: [activity, area]}
- {id: activity, term: Activity, def: "A piece of work that builds a capability, such as a stage of a playbook recipe. Each activity is broken into steps.", also: [task, "work item"], broader: "Capability", related: [step, recipe]}
- {id: step, term: Step, def: "The smallest unit of work on this page: one thing to do, as written in the DAM playbooks.", also: [action, "to-do"], broader: "Activity", related: [activity]}
- {id: recipe, term: Playbook recipe, def: "A repeatable method in the DAM playbooks, made of stages done in order, such as Mandate, Frame, Assign, Operate and Assure for data governance.", also: [method, "playbook stage"], related: [activity]}
- {id: maturity, term: Maturity strand, def: "A scale from level 1 to level 5 used to judge how well an organisation does one part of data management today.", also: ["maturity level", "maturity model"], related: [capability]}
- {id: lens, term: Perspective, def: "What data management means when seen from another profession, such as cyber security, technology or commercial.", also: [lens, viewpoint], related: [capability]}
- {id: raci, term: RACI, def: "Who is Responsible for doing a task, Accountable for it, Consulted about it and Informed of it.", also: ["responsibility matrix"], related: [owner]}
- {id: lineage, term: Lineage, def: "Where something comes from and what it leads to. On this page, how a data management area leads to capabilities, activities and pages.", also: ["data lineage", provenance], related: [traceability]}
- {id: traceability, term: Traceability, def: "Being able to follow a link from a requirement to the work that meets it and back again.", also: ["audit trail"], related: [lineage]}
- {id: coverage, term: Coverage, def: "How much of a capability the DAM playbooks already explain: covered, partly covered, or new (guidance still to come).", also: [completeness], related: [capability]}
- {id: dcat, term: DCAT, def: "The Data Catalog Vocabulary: a W3C web standard for describing datasets so catalogues can share records.", also: ["Data Catalog Vocabulary"], related: [profile, metadata]}
- {id: profile, term: Application profile, def: "A set of rules for using a standard like DCAT in one country or sector: which properties to use, which are required and which lists of values apply.", also: [AP, "metadata profile"], related: [dcat, mem]}
- {id: mem, term: xGov MEM, def: "The UK Cross-Government Metadata Exchange Model, the endorsed set of properties for describing government data. DCAT-AP-UK proposes how to evolve it.", also: ["Metadata Exchange Model"], related: [profile, metadata]}
- {id: github, term: GitHub, def: "A website where people store, share and work together on code and documents. Two of the portals are built on it; none needs you to code.", also: [repository, repo], related: [code]}
- {id: code, term: Public code, def: "Software that public bodies publish openly so others can read and reuse it.", also: ["open source code", "open code"], related: [github]}
- {id: ogl, term: Open Government Licence, def: "A licence that lets anyone copy, adapt and reuse public sector information, as long as they say where it came from.", also: [OGL], related: []}

# Compass 2.0: who uses it, as they think of themselves. Each audience is a way in: the tasks they bring, the data management areas they work in,
# the recipe stages they lead (RACI codes from the DAM playbooks), the communities they can join and the topics of guidance they need.
# The matching of audiences to tasks, areas, topics and communities is this compass's own, labelled so on the page.
audiences:
- id: leaders
  name: Leaders and senior owners
  icon: building-2
  who: Chief data officers, senior information risk owners, directors of data and senior responsible owners
  role: leader
  raci: [CDO, SRO, BRD]
  areas: [DM-GOV]
  routes: [policy, learn, estate]
  topics: ["Delivery, change and investment", Skills and professions, Data and AI]
  bodies: [GB-CDO, GB-DSASB, NW-NEWS]
  asks: ["What does the DAM Policy require of us, and by when?", "How mature is our data management?", "Where should we invest first?"]
- id: governance
  name: Policy and data governance
  icon: clipboard-list
  who: DAM Policy coordinators, data governance managers and advisers, programme leads for data
  role: coordinator
  raci: [COO, BRD]
  areas: [DM-GOV, DM-META]
  routes: [policy, estate, learn]
  topics: [Standards, Legislation, Data and AI, Content, Accessibility and equality]
  bodies: [NW-DMC, GB-PRG, GB-DSASB]
  asks: ["How do we run the yearly governance cycle?", "What goes in the critical data asset return?", "Who signs off what?"]
- id: owners
  name: Data owners and stewards
  icon: key-round
  who: Data owners, information asset owners, data stewards and custodians
  role: owner
  raci: [OWN, IAO, STW, CUS]
  areas: [DM-GOV, DM-DQ, DM-SEC]
  routes: [policy, quality]
  topics: [Records and information management, Data protection, Legislation]
  bodies: [NW-DMC, NW-GDQC]
  asks: ["What am I accountable for?", "What happens to my assets when I move role?", "How good does my data need to be?"]
- id: quality
  name: Data quality and analysis
  icon: gauge
  who: Data quality leads, analysts, statisticians and data scientists
  role: dq
  raci: [DQL]
  areas: [DM-DQ, DM-BI, DM-REF]
  routes: [quality, learn, reuse]
  topics: [Statistics, Data and AI]
  bodies: [NW-GDQC, NW-QCH, NW-DLCN, NW-ETH]
  asks: ["How do I write a data quality action plan?", "How do I measure and report quality?", "Which issues do I fix first?"]
- id: metadata
  name: Catalogues, metadata and records
  icon: library-big
  who: Catalogue managers, metadata specialists, information and records managers
  role: tech
  raci: [CAT, STW]
  areas: [DM-META, DM-DOC, DM-REF, DM-MOD]
  routes: [describe, estate, buy]
  topics: [Records and information management, Records, Standards, Geospatial]
  bodies: [GB-TOG, GB-OSB, NW-GDAC, NW-DMC]
  asks: ["What must a catalogue record say?", "Which metadata standard do we follow?", "How do records harvest into central discovery?"]
- id: technology
  name: Architecture and engineering
  icon: code-xml
  who: Data and enterprise architects, data engineers and developers
  role: tech
  raci: [ARC, CUS, MIG]
  areas: [DM-ARC, DM-INT, DM-OPS, DM-MOD]
  routes: [reuse, legacy, describe]
  topics: [Technology and architecture, Service delivery and technology, Standards]
  bodies: [GB-DTADA, NW-API, NW-DENG, NW-GDAC]
  asks: ["Has someone already built this?", "Which open standards should we use?", "How do we leave a legacy system without losing data?"]
- id: security
  name: Security, privacy and legal
  icon: lock-keyhole
  who: Security leads, data protection officers, information governance and legal advisers
  role: other
  raci: [DPO, IAO]
  areas: [DM-SEC]
  routes: [policy, legacy]
  topics: [Cyber and security, Security, Data protection, Legislation]
  bodies: [NW-DSNE, NW-ETH]
  asks: ["What is the lawful basis for this use?", "How is the asset classified and protected?", "Can we share it?"]
- id: commercial
  name: Commercial, finance and delivery
  icon: banknote
  who: Procurement and commercial staff, finance business partners, programme, product and service owners
  role: commercial
  raci: [CML, SVO, PDM]
  areas: [DM-OPS, DM-ARC]
  routes: [buy, legacy, reuse]
  topics: [Commercial and procurement, "Delivery, change and investment", Service delivery and technology]
  bodies: [NW-API]
  asks: ["What should a data tool contract say?", "How do we avoid lock-in?", "How do we put data in the business case?"]
- id: sectors
  name: Sector specialists
  icon: heart-handshake
  who: People working with health and care, local government, children's services, geospatial, statistics or fraud data
  role: other
  raci: []
  areas: [DM-DQ, DM-REF]
  routes: [policy, quality, describe]
  topics: [Health and care, Local government, Children and education, Geospatial, Fraud and error, Statistics]
  bodies: [NW-DLCN, NW-QCH, NW-DSNE]
  asks: ["Which extra rules apply to data in my sector?", "Which sector standards should our records follow?", "Who else works on this?"]

