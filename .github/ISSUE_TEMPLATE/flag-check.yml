name: Check a capability flag
description: Tell us a capability on the capability model should be flagged explicit, implicit or inferred differently
title: "[Flag] "
labels: ["content", "flag-check"]
body:
  - type: markdown
    attributes:
      value: This form is public. Do not include your name, colleagues' names, personal data or anything above OFFICIAL.
  - type: input
    id: capability
    attributes:
      label: Capability (for example CR-01)
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: How it is flagged now
  - type: dropdown
    id: proposed
    attributes:
      label: How you think it should be flagged
      options:
        - Explicit (the DAM Policy names it)
        - Implicit (the DAM Policy depends on it without naming it)
        - Inferred (not in the DAM Policy)
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Quote or link the clause of the DAM Policy or its guidance, if you can.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included names, personal data or anything above OFFICIAL
          required: true
