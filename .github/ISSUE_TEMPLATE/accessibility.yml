name: Accessibility problem
description: Tell us about something that is hard or impossible to use
title: "[Accessibility] "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: This form is public. You do not need to tell us about your own circumstances; describe what happened.
  - type: input
    id: page
    attributes:
      label: Page address
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you were trying to do, and what got in the way
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Browser and any assistive technology (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal data or anything sensitive
          required: true
