name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 3'
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
