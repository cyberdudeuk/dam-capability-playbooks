name: Build, check and publish
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly health run, Monday morning
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned tools
        run: |
          pip install -r requirements.txt
          npm ci
          python -m playwright install --with-deps chromium
      - name: Build (first pass, for page weights)
        run: python tools/build.py
      - name: Health run (sources, review date, page weight)
        id: health
        run: |
          set +e
          mkdir -p build
          python tools/health.py --out build/status.json > build/health.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat build/health.txt
      - name: Build (with the health report)
        run: python tools/build.py
      - name: Data Quality Commons kit, pinned, for the sector rule run (T-VAL)
        run: |
          if git clone --quiet https://github.com/cyberdudeuk/dq-commons.git "$RUNNER_TEMP/dq-commons" \
             && git -C "$RUNNER_TEMP/dq-commons" checkout --quiet f0f47424bb30dce5e7cece166d4d1c2d71fe1cef; then
            pip install -r "$RUNNER_TEMP/dq-commons/requirements.txt"
          else
            echo "::warning::Data Quality Commons kit not reachable; the sector rule run (T-VAL) will be skipped"
          fi
      - name: Vaccination tests (every static check must fail on a deliberate break)
        env:
          DQKIT_PATH: ${{ runner.temp }}/dq-commons
        run: python -m unittest discover -s tests -v
      - name: Static checks
        run: python tools/check_site.py
      - name: Browser checks
        run: python tools/check_browser.py
      - name: Browser check vaccinations
        run: |
          for b in overflow contrast focusfill consoleerror search tabs filters noscript contact progress display finder selfassess; do
            python tools/check_browser.py --break "$b"
          done
      - name: Open or update a health issue for a person to act on
        if: steps.health.outputs.code == '2' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'The weekly health run found problems. Nothing has been changed automatically.\n\n```\n%s\n```\n\nSee the Status page once published. Close this issue when a person has reviewed and fixed each problem.' "$(cat build/health.txt)")"
          existing=$(gh issue list --label health --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Health run needs attention" --label health --body "$body"; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
