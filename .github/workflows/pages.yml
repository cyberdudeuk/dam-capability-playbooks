name: Build, check and publish
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly health run, Monday morning
    - cron: '43 5 * * *'   # daily: keep the estate compass in step with the other portals (compass 1.2)
  workflow_dispatch:
  repository_dispatch:
    types: [portal-updated]   # a sister portal can ask for a rebuild when it publishes
# The repository only allows actions owned by its owner and pinned to a commit SHA (D-018), so every step is a plain
# command: git for checkout, the runner's Python and Node.js, and a push to the gh-pages branch for publishing.
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      discussions: read
    steps:
      - name: Check out the commit (plain git; the repository allows no third-party actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Python environment (runner's own Python 3, isolated in a virtual environment)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Show tool versions (Node.js comes with the runner image)
        run: python --version && node --version && npm --version
      - name: Install pinned tools
        run: |
          pip install -r requirements.txt
          npm ci
          # D-036: Ubuntu's package mirrors can be unreachable for minutes at a time. Retry with a pause, then fall back to the
          # browser alone (the runner image already has most of its libraries); the browser checks still fail if it cannot start.
          # Each attempt is capped at 10 minutes: on 11 November 2026 the step ran for over 90 minutes without finishing or failing.
          ok=0
          for attempt in 1 2 3; do
            if timeout 600 python -m playwright install --with-deps chromium; then ok=1; break; fi
            echo "::warning::Installing the browser and its system packages failed (attempt $attempt); retrying in 60 seconds"
            sleep 60
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::System packages could not be installed; installing the browser alone"
            timeout 600 python -m playwright install chromium
          fi
      - name: Build (first pass, for page weights)
        run: python tools/build.py
      - name: Health run (sources, review date, page weight)
        id: health
        run: |
          set +e
          mkdir -p build
          python tools/health.py --out build/status.json > build/health.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat build/health.txt
      - name: Ideas from GitHub Discussions, for Have your say (never fails the build)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ideas.py --out build/ideas.json
      - name: Estate compass, checked against the other portals (never fails the build)
        run: python tools/compass_sync.py --out build/compass-sync.json --report build/compass-sync.txt
      - name: Build (with the health report)
        run: python tools/build.py
      - name: Data Quality Commons kit, pinned, for the sector rule run (T-VAL)
        run: |
          if git clone --quiet https://github.com/cyberdudeuk/dq-commons.git "$RUNNER_TEMP/dq-commons" \
             && git -C "$RUNNER_TEMP/dq-commons" checkout --quiet f0f47424bb30dce5e7cece166d4d1c2d71fe1cef; then
            pip install -r "$RUNNER_TEMP/dq-commons/requirements.txt"
          else
            echo "::warning::Data Quality Commons kit not reachable; the sector rule run (T-VAL) will be skipped"
          fi
      - name: Vaccination tests (every static check must fail on a deliberate break)
        env:
          DQKIT_PATH: ${{ runner.temp }}/dq-commons
        run: python -m unittest discover -s tests -v
      - name: Static checks
        run: python tools/check_site.py
      - name: Browser checks
        run: python tools/check_browser.py
      - name: Browser check vaccinations
        run: |
          for b in overflow contrast focusfill consoleerror search tabs filters noscript contact progress display finder selfassess navclip damarole tours compass compasswheel compassdir ask; do
            python tools/check_browser.py --break "$b"
          done
      - name: Open or update a health issue for a person to act on
        if: steps.health.outputs.code == '2' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'The weekly health run found problems. Nothing has been changed automatically.\n\n```\n%s\n```\n\nSee the Status page once published. Close this issue when a person has reviewed and fixed each problem.' "$(cat build/health.txt)")"
          existing=$(gh issue list --label health --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Health run needs attention" --label health --body "$body"; fi
      - name: Open or update a compass issue when a portal changed in a way that needs a person
        if: github.event_name != 'pull_request' && hashFiles('build/compass-sync.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s build/compass-sync.txt ]; then exit 0; fi
          gh label create compass-sync --color f2c14e --description "Estate compass needs a mapping decision" --force >/dev/null 2>&1 || true
          body="$(printf 'The daily estate compass check found changes in the other portals. Missing links are already hidden from the compass, so nobody is sent to a missing page; a person needs to decide the new mapping.\n\n```\n%s\n```\n\nClose this issue when the mapping in tools/compass.py or compass/compass.yaml is updated.' "$(cat build/compass-sync.txt)")"
          existing=$(gh issue list --label compass-sync --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Estate compass: portal changes to map" --label compass-sync --body "$body"; fi
      - name: Publish to the gh-pages branch (GitHub Pages source - Deploy from a branch, gh-pages, root)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          src=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type + ":" + (.source.branch // "")' 2>/dev/null || echo unknown)
          if [ "$src" != "legacy:gh-pages" ]; then
            echo "::warning::Published to gh-pages, but GitHub Pages is set to '${src}'. In Settings, Pages, choose 'Deploy from a branch', branch gh-pages, folder / (root)."
          fi
