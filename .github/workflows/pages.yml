name: Build, check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned tools
        run: |
          pip install -r requirements.txt
          npm ci
          python -m playwright install --with-deps chromium
      - name: Build
        run: python tools/build.py
      - name: Vaccination tests (every static check must fail on a deliberate break)
        run: python -m unittest discover -s tests -v
      - name: Static checks
        run: python tools/check_site.py
      - name: Browser checks
        run: python tools/check_browser.py
      - name: Browser check vaccinations
        run: |
          for b in overflow contrast focusfill consoleerror search tabs filters noscript; do
            python tools/check_browser.py --break "$b"
          done
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
