name: Dependency review
# Stops a pull request that adds a dependency with a known moderate or worse vulnerability. GitHub's dependency graph does
# the work; nothing from the pull request is installed or run. GitHub-owned action, pinned to a reviewed commit (ADR 0005).
on: [pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with: {fail-on-severity: moderate}
