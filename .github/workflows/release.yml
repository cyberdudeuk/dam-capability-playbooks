name: Release
# Plain commands only: the repository allows no third-party actions (D-018).
# A person pushes a version tag (for example v1.1.0). This workflow builds, checks and attaches the site as a zip.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit (plain git; the repository allows no third-party actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Python environment (runner's own Python 3, isolated in a virtual environment)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - run: python tools/build.py && python tools/check_site.py && python -m unittest discover -s tests
      - run: cd site && zip -qr "../dam-capability-playbooks-${GITHUB_REF_NAME}.zip" .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dam-capability-playbooks-${GITHUB_REF_NAME}.zip" --generate-notes --title "$GITHUB_REF_NAME"
