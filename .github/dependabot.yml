version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
  # Proposes new commits for the reviewed actions (ADR 0005). C-24 fails until a person checks the new commit against its
  # release tag and records it in REVIEWED_ACTIONS, so no update merges unreviewed.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
