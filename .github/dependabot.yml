version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
  # Proposes new commits for the reviewed actions (ADR 0005). C-24 fails until a person checks the new commit against its
  # release tag and records it in REVIEWED_ACTIONS, so no update merges unreviewed.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    # CodeQL's init, analyze and upload-sarif steps must run the same version. Bumped
    # one at a time they fail with "Loaded a configuration file for version X, but running
    # version Y" (seen on 13 Nov 2026). This group moves them in one pull request.
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
