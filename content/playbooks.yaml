# ---------------------------------------------------------------------------
# Roles: one model across the three capabilities
# ---------------------------------------------------------------------------
roles:
- {code: CDO, name: Chief data officer, text: "Implements the policy in the organisation and leads the identification exercise; sponsors governance.", src: SRC-DAM, prov: V}
- {code: COO, name: Lead policy coordinator, text: "Coordinates identification, collates and assures the return (including ALBs), and is the link to the Working Group.", src: SRC-IDC, prov: P}
- {code: BRD, name: Data governance board, text: "Sets policy direction, resolves escalations and sees every asset's status. Chaired by the CDO, SIRO or equivalent.", src: null, prov: P}
- {code: OWN, name: Data owner, text: "Senior leader accountable for the meaning, content, quality and management of the asset; approves changes and signs off targets and risks.", src: SRC-OWN, prov: V}
- {code: IAO, name: Information asset owner, text: "Accountable to the SIRO for protecting the whole information asset; may hold data owner duties under the IAO or hybrid option.", src: SRC-OWN, prov: V}
- {code: STW, name: Data steward, text: "Runs the asset day to day: policies and standards, access, quality processes and documentation such as the business glossary in the catalogue.", src: SRC-OWN, prov: V}
- {code: CUS, name: Data custodian, text: "Technical expert for the system holding the data: storage, access controls, auditable change and disposal.", src: SRC-OWN, prov: V}
- {code: CAT, name: Catalogue manager, text: "Runs the organisation's catalogue, its metadata standard and its harvest feed.", src: null, prov: O}
- {code: DQL, name: Data quality lead or analyst, text: "Methods, profiling, tooling and reporting for data quality.", src: SRC-DQAP, prov: V}
- {code: DPO, name: Data protection officer, text: "Independent advice on lawful basis, DPIAs and data subject rights.", src: null, prov: K}
- {code: USR, name: Data users, text: "Teams, services and other organisations that rely on the data; say what they need and report problems.", src: SRC-DQAP, prov: V}
- {code: PUB, name: People the data describes, text: "Citizens, communities and their representatives; help spot exclusion and test whether quality information is understandable.", src: null, prov: P}

# ---------------------------------------------------------------------------
# The three capabilities
# ---------------------------------------------------------------------------
capabilities:
- id: gov
  in_brief:
  - Every critical data asset needs a named data owner. Governance is how you appoint them and keep them active.
  - Run five recipes in order the first time, then as a yearly loop.
  - Record decisions, issues and exceptions as you go, so your evidence for GDS builds itself.
  before_you_start:
  - Agreement from your chief data officer to lead adoption
  - A list of the data policies you already have, however informal
  - Your organisation's choice, or shortlist, of ownership option
  you_get: [A one-page charter, An ownership register, Live decision and exception logs, An evidence pack for the GDS return]
  name: Data governance
  short: Governance
  colour: '#1d70b8'
  icon: shield-check
  question: Who decides, by what authority, and how do we know it is working?
  purpose: >-
    Put the authority, roles and routines in place so that every critical data asset has a named, active owner,
    decisions are made and recorded, and the organisation can evidence its DAM Policy adoption.
  why: The policy requires a named data owner for every asset (DAM-R05), an ownership option that still meets the mandatory IAO actions (DAM-R09), and CDO-led implementation under CDO Council oversight (DAM-R08).
  method_name: Five recipes
  method_intro: >-
    Five repeatable recipes: Mandate, Frame, Assign, Operate and Assure. Run them in order the first time, then as a
    loop, with Assure feeding lessons back into Mandate. The sequence comes from the cross-government Data Governance Playbook
    (practitioner draft); the requirements it meets come from GDS guidance.
  method_prov: P
  stages:
  - n: 1
    id: mandate
    name: Mandate
    goal: Establish the authority everything else operates under.
    trigger: A new governance need, the start of DAM Policy adoption, or the annual refresh.
    steps:
    - Confirm the sponsor (the CDO, SIRO or equivalent) who will chair or co-sign the charter.
    - Draft a one-page charter covering purpose, scope, authority and review cadence.
    - State which data, systems and decisions are in scope, and any exclusions. Start narrow, with critical data assets.
    - Route the charter for approval and record the decision and its date.
    - Publish it to every stakeholder found during scoping.
    outputs: [Governance charter, Board terms of reference, Scope statement with exclusions, Sign-off record]
    checklist:
    - Sponsor confirmed in writing
    - Scope covers every critical data asset the organisation owns
    - Sign-off obtained and dated
    - Review date set, at least annual
    raci: {CDO: A, BRD: R, COO: R, OWN: C, STW: I, DPO: C}
    reqs: [DAM-R08, DAM-R14]
    tip: A charter that tries to cover everything is approved slowly or not at all. Widen scope at the annual refresh once the model works.
  - n: 2
    id: frame
    name: Frame
    goal: Assemble a proportionate rulebook to make decisions against.
    trigger: The charter is approved and policy gaps are known.
    steps:
    - List every data policy and standard already in force, however informal.
    - Compare it with the core areas - governance, classification and handling, quality, retention and disposal, access and sharing, metadata, master and reference data, and ethics including AI use.
    - Draft or adopt what is missing, in proportion to the risk. Reuse cross-government guidance before writing your own.
    - Give every policy a named owner (a role) and a review date.
    - Register each policy and make it findable, ideally in the data catalogue.
    outputs: [Policy and standards register, Gap assessment, Policy owner list with review dates]
    checklist:
    - Gap assessment against the core areas done
    - Every policy has an owner role and a review date
    - The register is published and findable
    raci: {CDO: A, BRD: A, COO: R, OWN: C, STW: C, DPO: C}
    reqs: [DAM-R09]
    tip: Adopting a cross-government template keeps you consistent with other departments and makes shared assurance easier.
  - n: 3
    id: assign
    name: Assign
    goal: Put a named, accountable owner and an active steward against every critical data asset.
    trigger: Policies are adopted and critical assets lack named owners.
    steps:
    - Choose your ownership option - IAO model, data ownership model or hybrid - and record the decision.
    - For each critical data asset, propose an owner of matching seniority (SCS for large or complex assets; Grade 6 or 7 for smaller ones), a steward and a custodian.
    - Agree decision rights using the RACI below and any delegated thresholds.
    - Brief role holders and record training (Data Owner and Steward training).
    - Record owner, steward, custodian, effective date and a named successor in the ownership register and the catalogue record.
    outputs: [Ownership option decision, Data ownership register, RACI per asset or asset class, Succession plan]
    checklist:
    - Every critical data asset has a named owner
    - Every role has a named deputy or successor
    - The catalogue record shows the owner role and a contact point that is a team or form, never a personal inbox
    - Mandatory IAO actions still covered whichever option you chose
    raci: {CDO: A, BRD: C, COO: R, OWN: R, STW: R, CUS: C, IAO: C}
    reqs: [DAM-R05, DAM-R09, DAM-R10]
    tip: A single point of failure in accountability is the most common finding when this step is audited. Name a backup for every owner and steward.
  - n: 4
    id: operate
    name: Operate
    goal: Make governance visible day to day.
    trigger: Owners are in place and governance moves into business as usual.
    steps:
    - Set the board's cadence (monthly, at least quarterly) and publish the calendar.
    - Keep a decision log - what, who, why, when and the review trigger.
    - Keep an issue and risk log, with quality issues coming in from the DQAP.
    - Log every deviation from policy as an exception with an owner and an expiry date.
    - Escalate anything unresolved up the ladder.
    outputs: [Decision log, Issue and risk log, Exception register, Board minutes]
    checklist:
    - Decision log active and current
    - Every exception has an expiry date
    - Escalations tracked to resolution
    - Minutes published within five working days
    raci: {CDO: I, BRD: A, OWN: R, STW: R, CUS: C, DQL: C, DPO: C}
    reqs: [DAM-R05]
    tip: An empty decision log after three months is a warning, not efficiency. Decisions are being made off the record.
  - n: 5
    id: assure
    name: Assure
    goal: Prove it works and feed the lessons back into the mandate.
    trigger: A reporting cycle, the annual return or an audit is due.
    steps:
    - Re-run the data maturity self-assessment.
    - Compile measures from the live registers - owner coverage, review currency, DQAP coverage, exceptions.
    - Map evidence to the GDS annual return as you go, not at the deadline.
    - Have someone outside the board check the evidence before submission.
    - Submit, then log lessons back into Mandate.
    outputs: [Maturity score and narrative, Measures pack, Evidence pack mapped to the GDS return, Lessons note]
    checklist:
    - Evidence collected continuously during Operate
    - Independent check done before submission
    - Return submitted on time
    - Lessons logged to Mandate
    raci: {CDO: A, BRD: R, COO: R, OWN: C, STW: C, DQL: C}
    reqs: [DAM-R03, DAM-R08]
    tip: Keep an evidence folder updated every time a decision is logged, so the return is collation, not reconstruction.
  roles: [CDO, BRD, COO, OWN, IAO, STW, CUS, DPO]
  escalation_note: The ladder and its timescales are this playbook's recommendation, not a GOV.UK requirement.
  escalation:
  - {level: Tier 1, who: Steward or custodian, trigger: Working-level query or minor exception, when: 2 working days}
  - {level: Tier 2, who: Data owner, trigger: Access, quality or sharing decision within remit, when: 5 working days}
  - {level: Tier 3, who: Data governance board, trigger: Cross-owner conflict, policy exception or high risk, when: 10 working days}
  - {level: Tier 4, who: CDO, SIRO or accounting officer, trigger: Unresolved board decision or legal or reputational risk, when: As required}
  measures:
  - {name: Critical data assets with a named owner, target: 100%}
  - {name: Owners and stewards with a named successor, target: 100%}
  - {name: Policies with an owner and an in-date review, target: 100%}
  - {name: Open exceptions past their expiry date, target: '0'}
  templates:
  - {id: T-GOV-1, name: Governance charter, fields: [Purpose, Scope and exclusions, Authority and sponsor, Membership, Decision rights, Review cadence, Sign-off (role and date)]}
  - {id: T-GOV-2, name: Data ownership register entry, fields: [Asset identifier, Asset title, Ownership option (IAO, data owner or hybrid), Data owner (role), Information asset owner (role), Data steward (role), Data custodian (role), Successor (role), Effective date, Training completed, Next review]}
  - {id: T-GOV-3, name: Decision log entry, fields: [Decision ID, Date, Decision, Decided by (role or forum), Rationale, Assets affected, Review trigger]}
  - {id: T-GOV-4, name: Exception register entry, fields: [Exception ID, Policy deviated from, Rationale, Owner (role), Risk accepted by (role), Start date, Expiry date, Review outcome]}

- id: cat
  in_brief:
  - Find the data other organisations depend on, and decide which of it is critical.
  - Describe each critical data asset well enough for someone outside your team to find and judge it.
  - Keep the descriptions in a catalogue, report them to GDS, and review them every year.
  before_you_start:
  - A named coordinating team, led by your chief data officer
  - Access to your data catalogue, information asset register and register of data sharing agreements
  - Ownership confirmed, or under way, through the governance Assign recipe
  you_get: [A designation log with reasons, A catalogue record per asset, An assured return to GDS, An annual review record]
  name: Data cataloguing
  short: Cataloguing
  colour: '#00703c'
  icon: library-big
  question: What critical data do we hold, is it described well enough to find and reuse, and have we told GDS?
  purpose: >-
    Find the critical data assets, describe each one to the cross-government metadata standard, keep the
    descriptions in a catalogue that others can harvest, and report them to GDS every year.
  why: Identifying, cataloguing, reporting and annually reviewing metadata are all 'must' requirements (DAM-R01 to DAM-R04).
  method_name: Eight stages
  method_intro: >-
    Eight stages from mobilising the team to the annual review. The sequence is this playbook's synthesis of the
    policy, the identification guidance and the metadata guidance; each step points to the requirement it meets.
    The internal Data Cataloguing Playbook (v2.6) is the fuller source and is not yet public (open item OR-01).
  method_prov: O
  stages:
  - n: 1
    id: mobilise
    name: Mobilise
    goal: Have a named lead and a coordinating team before identification starts.
    trigger: Policy adoption begins, or a new reporting cycle opens.
    steps:
    - The CDO (or most senior data official) leads and appoints a coordinating team or person.
    - Nominate the lead policy coordinator for the Working Group.
    - Agree how the department will coordinate and assure its ALBs' returns.
    - Bring in data owners, IAOs, stewards, service owners, analysts and policy makers.
    outputs: [Named lead and coordinator, Contributor list, ALB coordination plan]
    checklist:
    - Coordinator nominated to the Working Group
    - Every ALB has a named contact role
    raci: {CDO: A, COO: R, OWN: C, IAO: C, STW: C}
    reqs: [DAM-R14, DAM-R03]
  - n: 2
    id: discover
    name: Discover candidates
    goal: Build a long list of data other organisations depend on.
    trigger: The team is mobilised.
    steps:
    - Start from what you already have - data catalogues, information asset registers and registers of data sharing agreements.
    - Find data you provide to, or acquire from, other organisations for an essential process or purpose.
    - Prioritise assets supporting government missions and your services (including Top 75 services).
    - Include high-reuse-value assets not yet shared.
    outputs: [Candidate list with source of each entry]
    checklist:
    - All three starting registers searched
    - Both directions covered - data provided and data acquired
    raci: {CDO: A, COO: R, CAT: R, STW: C, OWN: C, USR: C}
    reqs: [DAM-R01]
  - n: 3
    id: designate
    name: Test and designate
    goal: Decide which candidates are critical data assets, and draw each asset's boundary.
    trigger: The candidate list is complete.
    steps:
    - Apply the policy's scope tests - classified OFFICIAL, meets the critical data asset criteria, within your ownership accountabilities.
    - Record which of the seven purposes each asset supports.
    - Draw the boundary - only the fields needed for the cross-government purpose form the asset, not the whole system.
    - If you designate a distribution, designate its source data set too.
    - Record why each candidate was or was not designated.
    outputs: [Designation decisions with reasons, Asset boundary per asset]
    checklist:
    - Every asset passes all scope tests
    - Every asset has at least one purpose
    - Source data sets designated where a distribution is
    raci: {CDO: A, COO: R, OWN: R, STW: C, DPO: C}
    reqs: [DAM-R01, DAM-R11, DAM-R12]
  - n: 4
    id: own
    name: Confirm ownership
    goal: Every designated asset has a named, accountable owner before it is described.
    trigger: Assets are designated.
    steps:
    - Confirm the owner (data owner or IAO) and steward for each asset with the governance Assign recipe.
    - Use a shared team contact point for the asset, never a personal inbox.
    - Record a successor so the metadata survives the owner leaving.
    outputs: [Owner, steward and contact point per asset]
    checklist:
    - No asset goes forward without a named owner
    - Contact point is a team route or form
    raci: {CDO: A, OWN: R, STW: R, COO: C}
    reqs: [DAM-R05, DAM-R10]
  - n: 5
    id: describe
    name: Describe
    goal: Describe each asset well enough for someone outside your team to find, understand and judge it.
    trigger: The asset has an owner.
    steps:
    - Record the properties in the metadata guidance (see the metadata tab).
    - Write in plain English; expand acronyms; describe the data, and put usage warnings in usage notes.
    - Use ISO 8601 dates, IANA media types, and 'unknown' or 'not applicable' rather than blanks.
    - Model datasets, data services and distributions as the MEM and DCAT do.
    - Add quality information from the DQAP (see data quality, stage 6).
    outputs: [Catalogue record per asset, conforming to the metadata guidance]
    checklist:
    - Title and description are plain English
    - Access rights, licence and security classification recorded
    - Dates in ISO 8601
    raci: {OWN: A, STW: R, CAT: R, CUS: C, DQL: C}
    reqs: [DAM-R02, DAM-R13]
  - n: 6
    id: publish
    name: Catalogue and expose
    goal: Keep the record in your catalogue in a form others can harvest.
    trigger: Records are complete.
    steps:
    - Store each record in the organisation's catalogue, or an asset register where no catalogue exists yet.
    - Expose records in DCAT so portals and the Discoverability Platform can harvest them.
    - Make sure every link in a record works from outside your organisation.
    - Choose catalogue tools against what any catalogue must expose, not a single vendor.
    outputs: [Catalogue entries, Machine-readable feed]
    checklist:
    - Records are reachable by harvest, not only by people
    - No record depends on an internal-only link
    raci: {OWN: A, CAT: R, CUS: R, STW: C}
    reqs: [DAM-R02, DAM-R16]
  - n: 7
    id: report
    name: Report to GDS
    goal: Submit an assured return on time.
    trigger: A return window opens (baseline January 2027).
    steps:
    - Prepare the return from catalogue records, not by retyping them.
    - Collate and assure ALB returns.
    - Check the return before submission so moderation is about judgement, not formatting.
    - Submit through the interim template, or the Discoverability Platform when it is live.
    outputs: [Assured return, ALB assurance record]
    checklist:
    - Every asset in the return has an owner, a purpose and current metadata
    - ALB returns assured by the department
    raci: {CDO: A, COO: R, CAT: R, OWN: C, BRD: I}
    reqs: [DAM-R03]
  - n: 8
    id: maintain
    name: Maintain and review
    goal: Records stay true.
    trigger: Every 12 months, and whenever an asset or its owner changes.
    steps:
    - Review every record at least every 12 months.
    - Update records when the asset changes, and when the owner leaves.
    - Retire assets that are no longer critical, with a reason.
    - Feed findings into the governance Assure recipe.
    outputs: [Annual review record, Updated catalogue entries]
    checklist:
    - Every record reviewed in the last 12 months
    - Owner changes reflected within the month
    raci: {OWN: A, STW: R, CAT: R, COO: C}
    reqs: [DAM-R04, DAM-R10]
  roles: [CDO, COO, OWN, IAO, STW, CUS, CAT, USR]
  metadata:
  # From SRC-MD (verified 5 November 2026) mapped to the xGov MEM (SRC-MEM). The guidance does not set one
  # mandatory/recommended column, so obligation follows the wording of each section.
  - {prop: title, mem: CataloguedResource.title, obligation: must, rule: Plain English name; avoid acronyms and jargon}
  - {prop: alternativeTitle, mem: CataloguedResource.alternativeTitle, obligation: optional, rule: A short name to keep titles concise}
  - {prop: description, mem: CataloguedResource.description, obligation: must, rule: Describes the data; usage warnings go elsewhere}
  - {prop: identifier, mem: CataloguedResource.identifier, obligation: should, rule: Your own system's identifier or an opaque random one, not sequential}
  - {prop: creator, mem: CataloguedResource.creator, obligation: must, rule: The organisation that created the data, from a list of organisations}
  - {prop: dateCreated, mem: CataloguedResource.created, obligation: should, rule: ISO 8601 date or date-time}
  - {prop: temporalCoverage, mem: none in MEM (gap), obligation: listed, rule: The period the data applies to}
  - {prop: conformsTo, mem: none in MEM (gap), obligation: listed, rule: The standard or schema the data follows}
  - {prop: accessRights, mem: CataloguedResource.accessRights, obligation: should, rule: 'open, commercial or internal, with any handling caveat'}
  - {prop: securityClassification, mem: CataloguedResource.securityClassification, obligation: listed, rule: Sensitivity level, OFFICIAL for assets in scope}
  - {prop: licence, mem: CataloguedResource.licence, obligation: should, rule: OGL URL for open data; the agreement for restricted data}
  - {prop: mediaType, mem: Distribution.mediaType, obligation: should, rule: IANA media type, such as text/csv}
  - {prop: expires, mem: none in MEM (gap), obligation: listed, rule: How long this version is valid}
  - {prop: supersededBy, mem: none in MEM (gap), obligation: listed, rule: The newer version that replaces this one}
  measures:
  - {name: Designated assets with a catalogue record, target: 100%}
  - {name: Records reviewed in the last 12 months, target: 100%}
  - {name: Records with access rights, licence and classification, target: 100%}
  - {name: Records harvestable as DCAT, target: Rising each quarter}
  templates:
  - {id: T-CAT-1, name: Candidate and designation log, fields: [Candidate, Found in (catalogue, IAR or sharing register), Provided to or acquired from, Purpose (one or more of seven), Scope tests passed, Designated (yes or no), Reason, Decided by (role), Date]}
  - {id: T-CAT-2, name: Critical data asset catalogue record, fields: [title, alternativeTitle, description, identifier, creator, dateCreated, temporalCoverage, conformsTo, accessRights, securityClassification, licence, mediaType, expires, supersededBy, Owner (role), Contact point (team or form), Purpose, Last reviewed, Next review]}
  - {id: T-CAT-3, name: Annual record review, fields: [Asset, Date, Still critical (and why), Owner and successor confirmed, Metadata checked against the guidance, Changes made, Signed off by (role)]}

- id: dq
  in_brief:
  - Every critical data asset needs a data quality action plan (DQAP) or an equivalent.
  - Agree what 'good enough' means with users, test it with rules, and fix the causes of failures.
  - Publish how good the data is, including what it should not be used for.
  before_you_start:
  - A designated asset with a named data owner
  - Agreement from at least two user teams on what the data is used for
  - The DQAP template from GOV.UK, or the Data Quality Commons tools
  you_get: [A rule catalogue with targets, A baseline and issue log, A prioritised action plan, A plain-English data quality statement]
  name: Data quality
  short: Quality
  colour: '#b45f06'
  icon: gauge
  question: Is the data good enough for what it is used for, and are we fixing what is not?
  purpose: >-
    Know, prove and improve the quality of each critical data asset through a data quality action plan (DQAP),
    scored with the government issues framework, reported openly and repeated every cycle.
  why: Every identified asset must have a DQAP or equivalent (DAM-R06), and existing processes should cover all seven DQAP steps (DAM-R07).
  method_name: Eight stages over the seven DQAP steps
  method_intro: >-
    Eight stages taken from the Data Quality Commons playbook, which follows the seven steps of the GDS DQAP
    implementation guide and adds an annual review. Use the Commons for the tools - rule checking, issue scoring and
    DQAP workbooks; this page is the method and how it joins governance and cataloguing.
  method_prov: P
  stages:
  - n: 1
    id: identify
    name: Identify critical data
    dqap: Step 1
    goal: Know which data items in each asset matter most.
    trigger: The asset is designated and has an owner.
    steps:
    - Name the 5 to 15 data items that drive the most important decisions (critical data elements).
    - Record who uses the data, for what, and who or what it describes.
    - Log known issues in the DQAP issues log.
    outputs: [Criticality matrix, User and purpose map]
    checklist:
    - Critical data elements agreed with at least two user teams
    - You know which groups the data might miss
    raci: {OWN: A, STW: R, USR: C, DQL: C, PUB: I}
    reqs: [DAM-R06]
  - n: 2
    id: define
    name: Define rules and targets
    dqap: Step 2
    goal: Turn 'good enough' into rules a computer can test.
    trigger: Critical data elements are agreed.
    steps:
    - Choose the dimensions that matter - completeness, uniqueness, consistency, timeliness, validity, accuracy.
    - Write each rule in plain English first, then as a testable rule.
    - Set targets from the issues framework range for importance times impact.
    - Store rules as files (a data contract) so they survive a change of tool or supplier.
    outputs: [Rule catalogue, Targets, Data contract]
    checklist:
    - Every critical data element has at least one rule
    - Targets come from user impact, not from what the data already achieves
    raci: {OWN: A, STW: R, DQL: R, USR: C}
    reqs: [DAM-R06, DAM-R15]
  - n: 3
    id: baseline
    name: Measure a baseline
    dqap: Step 3
    goal: Know where you are today.
    trigger: Rules and targets are agreed.
    steps:
    - Profile the data and run every rule; record the date and data version.
    - Log every failure as an issue with its size and who it affects.
    - Break results down by group where you lawfully can.
    outputs: [Baseline results, Issue log]
    checklist:
    - Results are reproducible
    - Group differences looked for and recorded
    raci: {OWN: A, STW: R, DQL: R, CUS: C}
    reqs: [DAM-R06]
  - n: 4
    id: prioritise
    name: Prioritise and set goals
    dqap: Step 4
    goal: Fix what hurts most first.
    trigger: The baseline is recorded.
    steps:
    - Score each issue with the issues framework.
    - Resolve Critical immediately, High within one cycle, Medium within three and Low within six.
    - Agree the order with the owner and record accepted risks with a review date.
    outputs: [Prioritised issue list, Goals in the DQAP, Risk acceptances]
    checklist:
    - Every issue has a priority and a timescale
    - Issues affecting some groups more than others are not ranked down as 'small'
    raci: {OWN: A, STW: R, BRD: I, DQL: C}
    reqs: [DAM-R15]
  - n: 5
    id: improve
    name: Fix causes at source
    dqap: Step 5
    goal: Stop problems coming back.
    trigger: Goals are agreed.
    steps:
    - Ask why until you reach the cause - people, process, system, supplier or standard.
    - Prefer prevention at entry over downstream cleaning.
    - Put supplier duties and measures into contracts.
    - Re-run the rule to prove the fix worked.
    outputs: [Root cause records, Actions with owners, Evidence of fixes]
    checklist:
    - Every fix proved by re-running the rule
    - Any downstream cleaning is recorded and temporary
    raci: {OWN: A, STW: R, CUS: R, DQL: C}
    reqs: [DAM-R06]
  - n: 6
    id: report
    name: Report openly
    dqap: Step 6
    goal: Users know how good the data is and what it should not be used for.
    trigger: Each measurement cycle.
    steps:
    - Update a plain-English data quality statement - scores, trends, known issues and unsuitable uses.
    - Publish quality information with the catalogue record (W3C DQV) so it travels with the asset.
    - Report the status of all assets to the governance board; quality issues enter the issue and risk log.
    outputs: [Data quality statement, Quality metadata on the catalogue record, Board report]
    checklist:
    - Statement says what the data is not fit for
    - Quality information sits on the catalogue record
    raci: {OWN: A, STW: R, CAT: R, BRD: I, USR: I}
    reqs: [DAM-R06]
  - n: 7
    id: sustain
    name: Repeat and sustain
    dqap: Step 7
    goal: Quality stays good without heroics.
    trigger: After the first cycle.
    steps:
    - Run checks automatically on each load or on a fixed cycle.
    - Track trends and alert when a rule drops below target.
    - Escalate with the agreed thresholds.
    - Keep rules, results and the plan in version control.
    outputs: [Automated checks, Trend record, Escalation log]
    checklist:
    - Checks run without manual effort
    - The steward has a named deputy
    raci: {OWN: A, STW: R, DQL: R, CUS: R}
    reqs: [DAM-R06, DAM-R07]
  - n: 8
    id: review
    name: Review every year
    dqap: Added by the Commons
    goal: Rules and targets still match what users need.
    trigger: Every 12 months, on the same date as the catalogue record review.
    steps:
    - Review rules, targets and the plan with the owner and users.
    - Add rules for new uses, including AI.
    - Retire rules that no longer matter; raise targets that are now easy.
    outputs: [Annual review note, Next year's goals]
    checklist:
    - Reviewed with the catalogue record, not separately
    - New uses assessed against the AI-ready data guidance
    raci: {OWN: A, STW: R, USR: C, PUB: C}
    reqs: [DAM-R04, DAM-R07]
  roles: [OWN, STW, CUS, DQL, USR, BRD, CAT, PUB]
  principles:
  - {name: Commit to data quality, src: SRC-GDQF}
  - {name: Know your users and their needs, src: SRC-GDQF}
  - {name: Assess quality throughout the data lifecycle, src: SRC-GDQF}
  - {name: Communicate data quality clearly and effectively, src: SRC-GDQF}
  - {name: Anticipate changes affecting data quality, src: SRC-GDQF}
  dimensions:
  - {name: Completeness, text: How fully records are present, including whether essential values are filled in}
  - {name: Uniqueness, text: Whether each thing is recorded once, without duplication}
  - {name: Consistency, text: Whether values agree with other values about the same thing, within or across data sets}
  - {name: Timeliness, text: Whether data is up to date for its use, with an acceptable lag}
  - {name: Validity, text: Whether data is in the expected range and format}
  - {name: Accuracy, text: How closely data matches reality}
  escalation_note: Timescales from the GDS issues framework, which presents them as an example; triggers from the Data Quality Commons.
  escalation:
  - {level: Critical, who: Data owner, with the board informed, trigger: A critical data element in the lowest band, or wrong data could harm people or break the law, when: Immediately}
  - {level: High, who: Data owner, trigger: More than one band below target, when: Within one cycle}
  - {level: Medium, who: Steward, trigger: One band below target, when: Within three cycles}
  - {level: Low, who: Steward, trigger: Slightly below target with low impact, when: Within six cycles}
  measures:
  - {name: Critical data assets with a current DQAP, target: 100%}
  - {name: Critical data elements with at least one rule, target: 100%}
  - {name: Critical issues resolved within timescale, target: 100%}
  - {name: Assets with quality information on the catalogue record, target: 100%}
  templates:
  - {id: T-DQ-1, name: Data quality rule, fields: [Rule ID, Data element, Plain-English rule, Dimension, Test, Importance (1-4), Impact (1-4), Combined score, Target (%), Owner (role), Date agreed]}
  - {id: T-DQ-2, name: Issue log entry, fields: [Issue ID, Date found, Rule ID, Records affected, Users or groups affected, Performance and target, Band, Priority, Target resolution date, Root cause, Action and owner (role), Status]}
  - {id: T-DQ-3, name: Data quality statement, fields: [Asset and version, Date, Summary in plain English, Scores by dimension and trend, Known issues, Quality by group where lawful, Fit for, Not fit for, How to report a problem (form)]}
  tools:
  - {name: Check a CSV file in the browser, url: https://cyberdudeuk.github.io/dq-commons/check.html}
  - {name: Score issues with the issues framework, url: https://cyberdudeuk.github.io/dq-commons/guidance.html}
  - {name: Full data quality management playbook, url: https://cyberdudeuk.github.io/dq-commons/playbook.html}
  - {name: Size a critical data asset baseline, url: https://cyberdudeuk.github.io/dq-commons/baseline.html}

# ---------------------------------------------------------------------------
# How the three capabilities join up
# ---------------------------------------------------------------------------
interlocks:
- {id: IL-01, from: gov.assign, to: cat.own, what: The ownership register is the source for the owner and successor on the catalogue record. Record them once.}
- {id: IL-02, from: cat.own, to: dq.identify, what: The owner on the catalogue record is the owner who signs off DQAP targets and accepts risks.}
- {id: IL-03, from: cat.designate, to: dq.identify, what: The asset boundary set at designation is the scope of the DQAP. No DQAP for fields outside the asset.}
- {id: IL-04, from: dq.report, to: cat.describe, what: Quality information is published on the catalogue record, so the record says how good the data is.}
- {id: IL-05, from: dq.report, to: gov.operate, what: Quality issues above Medium enter the board's issue and risk log.}
- {id: IL-06, from: gov.frame, to: cat.describe, what: The metadata standard and the classification policy adopted in Frame are what records are checked against.}
- {id: IL-07, from: cat.maintain, to: dq.review, what: One annual review date per asset covers the record, the owner and the DQAP together.}
- {id: IL-08, from: cat.report, to: gov.assure, what: The GDS return is part of the governance evidence pack, assembled as you go.}
- {id: IL-09, from: gov.assure, to: gov.mandate, what: Lessons from assurance refresh the mandate for the next cycle.}

cycle:
- {when: Before the window, gov: Confirm the mandate and owners, cat: Mobilise and refresh candidates, dq: Agree rules for any new assets}
- {when: Through the year, gov: Operate the logs, cat: Describe and keep records current, dq: Measure each cycle and fix at source}
- {when: Quarterly, gov: Board sees measures and exceptions, cat: Check harvest and record currency, dq: Update the action plan and statement}
- {when: Annual review date, gov: Assure and refresh the mandate, cat: Review every record and submit the return, dq: Review rules and targets}

