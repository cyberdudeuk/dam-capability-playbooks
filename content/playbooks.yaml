- {id: N-04, title: Information above OFFICIAL, text: "Do not enter information classified above OFFICIAL, or personal data, into this portal, its forms or its GitHub repository. Everything submitted through GitHub is public."}
- {id: N-05, title: Use of artificial intelligence, text: "An AI assistant (Claude, by Anthropic) helped research, write and build this portal. A person directed the work and reviews each release. Automated checks and source verification are described on the About page."}
- {id: N-06, title: External links, text: "Links to other sites are provided for reference. We are not responsible for their content or availability; the weekly health run reports links that stop working."}
