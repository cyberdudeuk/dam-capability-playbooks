# DAM capability playbooks: the single source of truth.
# Every page, export and vocabulary file in site/ is generated from this file by tools/build.py.
# Never edit generated files by hand.
#
# Provenance codes (build standard VER-07):
#   V  verified against the primary source on the date given
#   P  from a supplied pack (the owner's own playbook suites and portfolio material)
#   O  an operating rule or this playbook's own synthesis of verified sources
#   K  background knowledge (a lead, not a fact)
#   U  unconfirmed
# Requirement strength follows the source wording: must, should, may, method, gap.

meta:
  id: DAMCP
  title: DAM capability playbooks
  subtitle: Data governance, data cataloguing and data quality for critical data assets, in one place
  version: 1.0.0
  as_of: '2026-11-05'
  review: '2027-02-05'
  verified_on: '2026-11-05'
  owner_role: Data Management Lead, Data Management Team, Government Data (GDS)
  attribution: Emanuel Silva, Data Management Team, Government Data directorate, GDS (department per current machinery of government)
  repo: cyberdudeuk/dam-capability-playbooks
  site_url: https://cyberdudeuk.github.io/dam-capability-playbooks/
  contact_form: https://github.com/cyberdudeuk/dam-capability-playbooks/issues/new/choose
  contact_note: >-
    Contact is by form only. For now the form is this repository's issue form, which delivers to the repository's
    issues, not to a team inbox. Moving to the Data Management Team's own contact form is an open item (OR-02).
  licence_content: Open Government Licence v3.0
  licence_content_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  licence_code: MIT
  status: Prototype. Not an official GOV.UK service or published GDS guidance. Where it repeats GDS guidance, the GOV.UK page is the authority.
  profile: Public sector, UK, UK central government (departments and arm's length bodies), official work. Grade G3 (shared material others will rely on).
  grade_reason: Shared with departments and ALBs, so G3. It holds no personal data and makes no decisions about people, so not G4.
  intent: >-
    Identify, consolidate and assemble the playbook material for the three capabilities the Data Asset Management (DAM)
    Policy rests on (data governance, data cataloguing and data quality) and deliver it as one interactive portal on
    GitHub Pages, so that a lead policy coordinator, a data owner or a data steward has one place to start, can see
    what the policy requires, and can follow a method for each capability that joins up with the other two.

