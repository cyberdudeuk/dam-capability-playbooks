# Findings from verification (version 1.2)
findings:
- id: F-01
  title: Issues framework Table 4 contradicts its own rule for a 97.5% target
  detail: "The framework says the High band starts halfway between the Middle band start and the target. For a 97.5% target the Middle band starts at 95%, so the High band should start at 96.25%. Table 4 shows 96.75%. The other four rows follow the rule."
  src: SRC-DQIF
  verified: '2026-11-05'
  action: "This portal follows the stated rule. Raise with the GDS data quality team; tracked as a repository issue."
- id: F-02
  title: The Data Ethics Framework is now the Data and AI Ethics Framework
  detail: "The GOV.UK page at the Data Ethics Framework address is titled 'Data and AI Ethics Framework' (updated 18 December 2025)."
  src: null
  verified: '2026-11-05'
  action: "Use the new name. Earlier practitioner material that cites the old name should be updated."
- id: F-03
  title: The GOV.UK style guide has moved
  detail: "The style guide and 'writing for GOV.UK' addresses on GOV.UK now redirect to guidance.publishing.service.gov.uk."
  src: null
  verified: '2026-11-05'
  action: "Link to the new address."
- id: F-05
  title: The government data maturity framework uses a licence this portal cannot carry
  detail: "The Data Maturity Assessment for Government framework is published under CC BY-NC-SA 4.0, not the Open Government Licence, and asks government users to contact CDDO. Its level descriptions cannot be copied into OGL content."
  src: SRC-DMA
  verified: '2026-11-05'
  action: "The capability model links to each topic and level and records only names and row counts. Check C-21 stops its text being copied (OR-14)."
- id: F-06
  title: Legacy technology guidance asks for a data asset register but does not mention the DAM Policy
  detail: "The second principle of 'Managing legacy technology' (updated 15 October 2026) is to build a complete and accurate register of your data assets. The DAM Policy and its guidance do not refer to it, so legacy programmes may build a second, separate register."
  rb: RB-LEGACY
  verified: '2026-11-05'
  action: "Delivery and change practice CH-04 starts legacy exits from the DAM catalogue. Suggest GDS cross-refers the two."
- id: F-07
  title: The government learning platform is not yet fully accessible
  detail: "The Government Skills Campus accessibility statement (last updated 14 April 2026) says some parts do not meet WCAG 2.2 AA, with compliance aimed for by the end of 2026."
  url: https://www.gov.uk/government/publications/accessibility-statement-for-the-government-skills-campus-gsc
  url_title: Accessibility statement for the Government Skills Campus
  verified: '2026-11-05'
  action: "The learning routes point to public GOV.UK pages first; organisations should check that learners with access needs can use the platform or have an alternative."
- id: F-04
  title: Four metadata properties have no slot in the Metadata Exchange Model
  detail: "temporalCoverage, conformsTo, expires and supersededBy appear in the GOV.UK metadata guidance but not in the published MEM classes."
  src: SRC-MD
  verified: '2026-11-05'
  action: "Proposed crosswalk below, to be agreed by the metadata standards owner (OR-06)."

# Proposed crosswalk for the four guidance properties missing from the MEM (OR-06). Proposal, not agreed.
mem_proposal:
- {prop: temporalCoverage, term: "dcterms:temporal", note: "DCAT uses dcterms:temporal with a dcterms:PeriodOfTime (dcat:startDate, dcat:endDate)."}
- {prop: conformsTo, term: "dcterms:conformsTo", note: "Already used by DCAT for a standard or schema a resource conforms to."}
- {prop: expires, term: "dcterms:valid", note: "Dublin Core 'date (often a range) of validity'; record the end date. No DCAT-specific term exists."}
- {prop: supersededBy, term: "dcterms:isReplacedBy", note: "Dublin Core relation for a resource that supplants this one; DCAT 3 versioning also offers dcat:previousVersion in the other direction."}

# ---------------------------------------------------------------------------
# Service design artefacts (version 1.2). Each item has a stable id so it can be traced.
# ---------------------------------------------------------------------------
design:
  theory_of_change:
    problem: "Departments must adopt the DAM Policy, but guidance for its three capabilities is spread across many pages and practitioner packs, so the same facts are recorded several times and returns are assembled late."
    chain:
    - {id: TOC-IN, stage: Inputs, items: ["Published GOV.UK guidance behind the policy", "Practitioner playbooks for governance and quality", "Open standards (DCAT, MEM, DQV)", "GitHub for hosting, contact and automation"]}
    - {id: TOC-ACT, stage: Activities, items: ["Join the three capabilities into one method with one set of roles", "Give each role a route and a learning journey", "Check sources, accessibility and links automatically every week"]}
    - {id: TOC-OUT, stage: Outputs, items: ["One portal with step-by-step methods, templates and modules", "Open data versions of every requirement, template and term", "A public record of defects, open items and health"]}
    - {id: TOC-OC, stage: Outcomes, items: ["Owners, records and DQAPs are set up once and reused", "Returns are built from catalogue records, not retyped", "Practitioners know which requirement each step meets"]}
    - {id: TOC-IMP, stage: Impact, items: ["Critical data assets are owned, findable and fit for use across government", "Services that rely on shared data, and the people they serve, are less affected by poor data"]}
    assumptions: ["Practitioners will use a single portal if it saves them effort (untested, OR-04)", "Hand-offs between capabilities reduce duplicate recording (untested)", "GOV.UK guidance remains the authority and changes are caught weekly"]
  research:
    questions: ["Can each role find the steps that apply to them in under two minutes?", "Do the hand-offs match how departments actually organise ownership, cataloguing and quality?", "Which sector supplements (DD-01 to DD-14) are needed first?", "Can people with access needs complete a route without help?"]
    methods: ["Moderated usability sessions with 5 to 8 people per role, including people who use assistive technology", "Tree test of the navigation", "A survey through the Working Group", "Analysis of feedback received through the contact and feedback forms"]
    hypotheses:
    - {id: H-01, statement: "Routes by role reduce time to find the right step.", falsified_if: "Median time to find a step is not lower on a route than through search alone."}
    - {id: H-02, statement: "Recording the owner once and reusing it reduces mismatches.", falsified_if: "Owner mismatches between register, record and DQAP do not fall after adoption."}
    - {id: H-03, statement: "Learning modules improve confidence for new owners and stewards.", falsified_if: "Self-rated confidence does not rise after completing the role's modules."}
    ethics: "Participants give informed consent, can withdraw at any time, and are recorded only with permission. Notes name roles, not people. No session collects data above OFFICIAL."
  blueprint:
  - {id: BP-1, stage: Find, user: "Searches or follows a link to the portal", front: "Home page, role cards, search", back: "GitHub Pages hosting; sitemap and metadata for search engines", support: "Weekly health run keeps pages current"}
  - {id: BP-2, stage: Learn, user: "Works through modules for their role", front: "Learning page, checks of understanding, progress", back: "Progress kept in the reader's browser only", support: "Content reviewed against GOV.UK sources each release"}
  - {id: BP-3, stage: Do, user: "Follows step-by-step methods and copies templates", front: "Capability pages, templates, open data downloads", back: "Content file generates every page and export", support: "Build refuses broken references"}
  - {id: BP-4, stage: Report, user: "Builds the return and evidence pack", front: "Policy spine, joined-up year, templates", back: "Requirements and templates as CSV", support: "Release notes record changes that affect returns"}
  - {id: BP-5, stage: Improve, user: "Reports a problem or suggests a change", front: "Contact form, page feedback, Discussions", back: "GitHub issue forms and Discussions", support: "A person triages issues; fixes include a new check"}
  requirements:
  - {id: FR-01, kind: Functional, moscow: Must, text: "Show every DAM Policy requirement with its strength, source and the step that meets it.", features: [dam], checks: [C-03, C-08]}
  - {id: FR-02, kind: Functional, moscow: Must, text: "Give a step-by-step method for each capability with roles, templates and measures.", features: [governance, cataloguing, quality], checks: [C-10, B-06]}
  - {id: FR-03, kind: Functional, moscow: Must, text: "Offer a route and learning journey for each role, with progress the reader controls.", features: [personas, learning], checks: [B-10]}
  - {id: FR-04, kind: Functional, moscow: Must, text: "Let anyone get in touch without an email address being published.", features: [contact], checks: [C-04, C-14, B-09]}
  - {id: FR-05, kind: Functional, moscow: Should, text: "Let readers search everything and filter every list.", features: [index, library, knowledge], checks: [B-05, B-08]}
  - {id: FR-06, kind: Functional, moscow: Should, text: "Publish the vocabulary, requirements and templates as open data.", features: [library, knowledge], checks: [C-11]}
  - {id: NFR-01, kind: Non-functional, moscow: Must, text: "Meet WCAG 2.2 AA in light and dark modes, from 320 to 1920 pixels wide.", features: [all], checks: [B-01, B-02, B-03]}
  - {id: NFR-02, kind: Non-functional, moscow: Must, text: "Work with scripts turned off and load nothing from other sites.", features: [all], checks: [C-05, C-12, B-07]}
  - {id: NFR-03, kind: Non-functional, moscow: Must, text: "Label every fact with its provenance and keep sources current.", features: [all], checks: [C-08, HL-01]}
  - {id: NFR-04, kind: Non-functional, moscow: Must, text: "Name roles, never people, and hold no personal data.", features: [all], checks: [C-04, C-17]}
  - {id: NFR-05, kind: Non-functional, moscow: Should, text: "Be findable by search engines with accurate descriptions.", features: [all], checks: [C-16]}
  - {id: TR-01, kind: Technical, moscow: Must, text: "Generate every page from one content file and refuse to build on a broken reference.", features: [all], checks: [T-VAL]}
  - {id: FR-07, kind: Functional, moscow: Must, text: "Show every capability the policy and adjacent guidance need, flagged explicit, implicit or inferred, with a signpost to the section it comes from.", features: [capability-model], checks: [C-22, HL-02]}
  - {id: FR-08, kind: Functional, moscow: Should, text: "Let organisations assess their maturity against the government model and DAM strands, keep the answers privately and download them.", features: [capability-model], checks: [B-13, C-21]}
  - {id: FR-09, kind: Functional, moscow: Should, text: "Link each role in the policy to government professions, framework roles, skills and learning routes.", features: [professions], checks: [C-03, HL-01]}
  - {id: FR-10, kind: Functional, moscow: Must, text: "Help organisations embed the policy in business as usual and in change programmes, with actions they can track.", features: [change], checks: [B-08, B-10]}
  - {id: FR-11, kind: Functional, moscow: Should, text: "Help readers find which sector supplements apply to an asset.", features: [sectors], checks: [B-12, T-VAL]}
  - {id: IR-01, kind: Integration, moscow: Must, text: "Use only GitHub services: Pages, issue forms, Discussions, Actions and releases.", features: [contact, status, whats-new], checks: [C-05, HL-01]}
  architecture:
    components:
    - {id: AC-01, name: Content file, detail: "content/playbooks.yaml: requirements, methods, roles, personas, modules, sources and registers."}
    - {id: AC-02, name: Generator, detail: "tools/build.py: validates references, writes static pages, open data, sitemap, images."}
    - {id: AC-03, name: Front end, detail: "Static HTML and CSS with one progressive-enhancement script; no external assets; strict Content Security Policy."}
    - {id: AC-04, name: Checks, detail: "tools/check_site.py (static), tools/check_browser.py (Playwright with axe-core), tests/ (vaccinations)."}
    - {id: AC-05, name: Health run, detail: "tools/health.py: GOV.UK Content API source dates, review date and page weight; results on the Status page."}
    - {id: AC-06, name: GitHub services, detail: "Actions (build, check, publish, weekly health, CodeQL, release), Pages, issue forms, Discussions, Dependabot."}
    flows:
    - "Change: pull request -> build -> static checks -> vaccinations -> browser checks -> review -> merge -> Pages"
    - "Weekly: health run -> Status page -> issue labelled health if something needs a person"
    - "Contact: contact form -> pre-filled GitHub issue form -> person sends it -> triage"
    data: "No personal data is held. Browser storage keeps progress and display choices on the reader's device only."
  service_standard:
  - {n: 1, point: Understand users and their needs, rating: Partly, evidence: "Roles and needs drawn from practitioner material; research plan written, not yet run (OR-04)."}
  - {n: 2, point: Solve a whole problem for users, rating: Partly, evidence: "Joins three capabilities and the return; depends on GOV.UK guidance and departmental catalogues."}
  - {n: 3, point: Provide a joined up experience across all channels, rating: Partly, evidence: "Links to GOV.UK, the Working Group and the Data Quality Commons; offline support not covered."}
  - {n: 4, point: Make the service simple to use, rating: Met, evidence: "Routes by role, step by step, plain English, search; not yet tested with users."}
  - {n: 5, point: Make sure everyone can use the service, rating: Partly, evidence: "Automated WCAG 2.2 AA checks pass; no testing with disabled users yet (OR-09)."}
  - {n: 6, point: Have a multidisciplinary team, rating: Not yet, evidence: "Built by one practitioner with AI assistance; no dedicated team (OP20)."}
  - {n: 7, point: Use agile ways of working, rating: Met, evidence: "Small releases, public changelog, issues and pull requests."}
  - {n: 8, point: Iterate and improve frequently, rating: Met, evidence: "Weekly health run; feedback routes on every page."}
  - {n: 9, point: Create a secure service which protects users' privacy, rating: Met, evidence: "No personal data, strict CSP, CodeQL, Dependabot, security.txt."}
  - {n: 10, point: Define what success looks like and publish performance data, rating: Partly, evidence: "Success measures defined per capability; no usage data collected by design."}
  - {n: 11, point: Choose the right tools and technology, rating: Met, evidence: "Static site on GitHub Pages; open standards; ADRs recorded."}
  - {n: 12, point: Make new source code open, rating: Met, evidence: "Public repository under MIT; content under OGL."}
  - {n: 13, point: Use and contribute to open standards, components and patterns, rating: Met, evidence: "DCAT, SKOS, DQV, JSON-LD; GOV.UK Design System patterns."}
  - {n: 14, point: Operate a reliable service, rating: Partly, evidence: "Static hosting and health checks; single account dependency (OR-03)."}

