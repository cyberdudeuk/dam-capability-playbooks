# ---------------------------------------------------------------------------
# The DAM Policy spine: what the policy and its guidance require, by capability
# ---------------------------------------------------------------------------
requirements:
- {id: DAM-R01, cap: cat, strength: must, src: SRC-DAM, prov: V, text: "Identify the data assets in scope: classified OFFICIAL (including handling markings such as 'personal'), meeting the critical data asset criteria, and inside your own data ownership accountabilities."}
- {id: DAM-R02, cap: cat, strength: must, src: SRC-DAM, prov: V, text: "Identify and manage metadata about in-scope assets within your data catalogues."}
- {id: DAM-R03, cap: cat, strength: must, src: SRC-DAM, prov: V, text: "Report in-scope assets to GDS. Departments provide metadata on their assets and coordinate and assure the returns of their ALBs."}
- {id: DAM-R04, cap: cat, strength: must, src: SRC-DAM, prov: V, text: "Maintain metadata and review it every year."}
- {id: DAM-R05, cap: gov, strength: must, src: SRC-DAM, prov: V, text: "Every identified asset has a named data owner, accountable for decisions about the data."}
- {id: DAM-R06, cap: dq, strength: must, src: SRC-DAM, prov: V, text: "Every identified asset has a data quality action plan (DQAP) or an equivalent mechanism for managing its quality."}
- {id: DAM-R07, cap: dq, strength: should, src: SRC-DAM, prov: V, text: "Where you already manage the quality of critical data, review those processes to confirm they cover every step of the DQAP implementation guide."}
- {id: DAM-R08, cap: gov, strength: must, src: SRC-DAM, prov: V, text: "The chief data officer of each in-scope organisation implements the policy; the Chief Data Officer Council oversees implementation; the minister writes to ministers each year on progress."}
- {id: DAM-R09, cap: gov, strength: must, src: SRC-OWN, prov: V, text: "Choose an ownership option (keep the IAO model, adopt the data ownership model, or a hybrid) and still meet the mandatory IAO actions, with governance covering accountability, reporting lines, assurance and data quality."}
- {id: DAM-R10, cap: gov, strength: must, src: SRC-IDC, prov: V, text: "When a data owner leaves, tell the coordinating team, have a successor ready and give the successor's details so the metadata can be updated."}
- {id: DAM-R11, cap: cat, strength: should, src: SRC-IDC, prov: V, text: "Each critical data asset supports at least one of the seven purposes: public service delivery; legislative, legal or contractual requirement; defence, national security and resilience; policy development and evaluation; official statistics; public interest; fraud and error."}
- {id: DAM-R12, cap: cat, strength: should, src: SRC-IDC, prov: V, text: "If you designate a particular distribution of a data set, designate its source data set as well."}
- {id: DAM-R13, cap: cat, strength: should, src: SRC-MD, prov: V, text: "Record the metadata properties set out in the metadata guidance, in plain English, with ISO 8601 dates and 'unknown' or 'not applicable' rather than blanks."}
- {id: DAM-R14, cap: gov, strength: should, src: SRC-IDC, prov: V, text: "The chief data officer, or the most senior data official, leads identification and appoints a coordinating team or person, drawing in owners, IAOs, stewards, service owners, analysts and policy makers."}
- {id: DAM-R15, cap: dq, strength: method, src: SRC-DQIF, prov: V, text: "Prioritise quality issues with the issues framework: importance of purpose times impact sets the target range; the band below target sets priority. Its resolution timescales (Critical immediately; High, Medium and Low within 1, 3 and 6 measurements) are given as an example."}
- {id: DAM-R16, cap: cat, strength: gap, src: SRC-DAM, prov: V, text: "The policy's introduction promises minimum requirements for interoperability, but the policy body does not state them. Treat the metadata guidance and the MEM as the current interoperability baseline and watch for guidance (open item OR-05)."}

