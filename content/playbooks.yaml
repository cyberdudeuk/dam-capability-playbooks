# ---------------------------------------------------------------------------
# Knowledge layer: glossary, thesaurus (alt labels), taxonomy (broader)
# ---------------------------------------------------------------------------
concepts:
- {id: data-asset, term: Data asset, alt: [], broader: null, caps: [cat, gov], src: SRC-DAM, prov: V, def: "One or more data sets plus, where relevant, the data services used to access them."}
- {id: data-set, term: Data set, alt: [dataset], broader: data-asset, caps: [cat], src: SRC-DAM, prov: V, def: "A structured collection of data selected and organised for a defined outcome or need. It can be a subset of a larger system."}
- {id: data-service, term: Data service, alt: [API, access service], broader: data-asset, caps: [cat], src: SRC-DAM, prov: V, def: "A controlled means of accessing one or more data sets, such as an API or secure access mechanism."}
- {id: distribution, term: Distribution, alt: [representation], broader: data-set, caps: [cat], src: SRC-MEM, prov: V, def: "A specific representation of a data set, for example a CSV file or a feed."}
- {id: cda, term: Critical data asset, alt: [CDA, essential shared data asset, ESDA], broader: data-asset, caps: [cat, gov, dq], src: SRC-IDC, prov: V, def: "A data asset shared across government where losing access could stop an organisation from fulfilling important functions. 'Essential shared data asset' is the older term it replaced."}
- {id: provided, term: Provided data, alt: [], broader: cda, caps: [cat], src: SRC-IDC, prov: V, def: "Data one organisation gives to another to support an essential process or purpose the receiver is responsible for."}
- {id: acquired, term: Acquired data, alt: [], broader: cda, caps: [cat], src: SRC-IDC, prov: V, def: "Data one organisation obtains from another to support an essential process or purpose it is responsible for."}
- {id: purpose, term: Purpose, alt: [the seven purposes], broader: cda, caps: [cat], src: SRC-IDC, prov: V, def: "One of the seven reasons a critical data asset matters, such as public service delivery or official statistics. Each asset supports at least one."}
- {id: scope-tests, term: Scope tests, alt: [], broader: cda, caps: [cat, gov], src: SRC-DAM, prov: V, def: "The conditions an asset must meet to be in scope of the policy: classified OFFICIAL, critical, and within the provider's ownership accountabilities."}
- {id: metadata, term: Metadata, alt: [data about data], broader: null, caps: [cat], src: SRC-MD, prov: V, def: "Information that describes a data asset so it can be found, understood, validated, reused and shared."}
- {id: catalogue, term: Data catalogue, alt: [catalog, metadata catalogue], broader: null, caps: [cat], src: SRC-DAM, prov: O, def: "A managed collection of metadata records that helps people and systems find, understand and reuse data assets. It holds descriptions, not the data."}
- {id: dcat, term: DCAT, alt: [Data Catalog Vocabulary], broader: metadata, caps: [cat], src: SRC-DCAT, prov: K, def: "The W3C vocabulary for describing data sets and data services in catalogues, so catalogues can be harvested and searched together."}
- {id: mem, term: Metadata Exchange Model, alt: [xGov MEM, MEM], broader: metadata, caps: [cat], src: SRC-MEM, prov: V, def: "The UK cross-government model, based on DCAT, for the metadata exchanged about data assets."}
- {id: discoverability, term: Discoverability Platform, alt: [discovery service], broader: catalogue, caps: [cat], src: null, prov: P, def: "The GDS service being scoped to link to departments' own catalogues and make critical data asset metadata discoverable across government."}
- {id: return, term: Return, alt: [CDA return, baseline return, annual return], broader: null, caps: [cat, gov], src: SRC-DAM, prov: O, def: "An organisation's report of its in-scope assets and their metadata to GDS, assured by the department for its ALBs."}
- {id: data-owner, term: Data owner, alt: [], broader: role, caps: [gov, cat, dq], src: SRC-OWN, prov: V, def: "A senior leader accountable for the meaning, content, quality and management of a data asset."}
- {id: iao, term: Information asset owner, alt: [IAO], broader: role, caps: [gov], src: SRC-OWN, prov: V, def: "The role accountable to the SIRO for protecting the whole information asset. Related to, but not the same as, the data owner."}
- {id: data-steward, term: Data steward, alt: [], broader: role, caps: [gov, cat, dq], src: SRC-OWN, prov: V, def: "The role running an asset day to day: standards, access, quality processes and documentation."}
- {id: data-custodian, term: Data custodian, alt: [], broader: role, caps: [gov, cat], src: SRC-OWN, prov: V, def: "The technical expert for the system holding the data: storage, access controls, auditable change and disposal."}
- {id: role, term: Data role, alt: [], broader: null, caps: [gov], src: SRC-OWN, prov: O, def: "A defined set of accountabilities for data. Records name roles, not people."}
- {id: ownership-option, term: Ownership option, alt: [IAO model, hybrid model], broader: data-owner, caps: [gov], src: SRC-OWN, prov: V, def: "The choice between keeping the IAO model, adopting the data ownership model, or a hybrid. Each must still meet the mandatory IAO actions."}
- {id: recipe, term: Recipe, alt: [governance recipe], broader: null, caps: [gov], src: null, prov: P, def: "One of the five repeatable governance activities: Mandate, Frame, Assign, Operate, Assure."}
- {id: charter, term: Governance charter, alt: [charter], broader: recipe, caps: [gov], src: null, prov: P, def: "A one-page statement of a governance body's purpose, scope, authority and review cadence."}
- {id: decision-log, term: Decision log, alt: [], broader: recipe, caps: [gov], src: null, prov: P, def: "A running record of governance decisions: what, who, why, when and the review trigger."}
- {id: exception, term: Exception, alt: [policy exception], broader: recipe, caps: [gov], src: null, prov: P, def: "A logged, time-bound deviation from policy with an owner and an expiry date. An exception without an expiry is an undocumented policy change."}
- {id: raci, term: RACI, alt: [decision rights], broader: null, caps: [gov, cat, dq], src: SRC-DQAP, prov: O, def: "Responsible, Accountable, Consulted, Informed. One accountable role per activity."}
- {id: dqap, term: Data quality action plan, alt: [DQAP], broader: null, caps: [dq], src: SRC-DAM, prov: V, def: "The plan every identified asset must have, or an equivalent mechanism, for managing its quality across seven steps."}
- {id: cde, term: Critical data element, alt: [CDE], broader: dqap, caps: [dq, cat], src: SRC-DQC, prov: P, def: "A data item whose quality drives the most important decisions made with the asset."}
- {id: dimension, term: Data quality dimension, alt: [dimension], broader: dqap, caps: [dq], src: SRC-GDQF, prov: V, def: "A measurable aspect of quality. The framework's six are completeness, uniqueness, consistency, timeliness, validity and accuracy."}
- {id: issues-framework, term: Issues framework, alt: [data quality issues framework], broader: dqap, caps: [dq], src: SRC-DQIF, prov: V, def: "The GDS method that scores importance times impact to set targets, and uses the band below target to set priority and time to resolve."}
- {id: dq-statement, term: Data quality statement, alt: [quality statement], broader: dqap, caps: [dq, cat], src: SRC-DQC, prov: P, def: "A plain-English summary of an asset's quality, known issues and what it should not be used for."}
- {id: dqv, term: Data Quality Vocabulary, alt: [DQV], broader: metadata, caps: [dq, cat], src: SRC-DQV, prov: K, def: "The W3C vocabulary for publishing quality measurements with a catalogue record."}
- {id: data-contract, term: Data contract, alt: [ODCS], broader: dqap, caps: [dq], src: SRC-ODCS, prov: K, def: "Quality rules and promises written down as a file that suppliers and users share."}
- {id: maturity, term: Data maturity, alt: [DMA], broader: null, caps: [gov], src: SRC-DMA, prov: V, def: "An organisation's capability around data, self-assessed with the government framework."}
- {id: coordinator, term: Lead policy coordinator, alt: [policy coordinator], broader: role, caps: [gov, cat], src: null, prov: P, def: "The person each organisation nominates to coordinate DAM Policy adoption and the return, and to sit on the Working Group."}

# ---------------------------------------------------------------------------
# Accountability records shown on the About page
# ---------------------------------------------------------------------------
open_register:
- {id: OR-01, item: "The internal Data Cataloguing Playbook v2.6 is not public. The cataloguing stages here are a synthesis of GOV.UK guidance and need checking against it, or replacing with it once cleared.", who: Service owner}
- {id: OR-02, item: "Contact is the repository's issue form. Replace it with a dedicated form service that delivers privately, so people without a GitHub account can get in touch.", who: Service owner}
- {id: OR-03, item: "Not cleared as official guidance. Clearance, and a move to an official GitHub organisation, are needed before departments are told to rely on it.", who: Service owner}
- {id: OR-04, item: "No research with real users yet. A research plan with questions, methods, hypotheses and falsification conditions is now published on the Service design page; it needs participants through the Working Group.", who: Service owner, with the Working Group}
- {id: OR-05, item: "The policy promises minimum interoperability requirements that its body does not state.", who: GDS Data Frameworks and Standards}
- {id: OR-06, item: "Four metadata properties in the guidance have no slot in the published MEM. A crosswalk to DCAT and Dublin Core terms is proposed on the cataloguing page (finding F-04) and needs agreement.", who: Metadata standards owner}
- {id: OR-07, item: "Dates for the rollout phases, returns and support offer come from practitioner material, not a public page. Confirm before external use.", who: Service owner}
- {id: OR-08, item: "The governance escalation timescales are this playbook's recommendation. Each organisation should set its own.", who: Each organisation's board}
- {id: OR-09, item: "Not tested with disabled users or assistive technology users in person; automated checks only.", who: Service owner}
- {id: OR-10, item: "Data owner versus information asset owner is resolved by the GOV.UK data ownership model (three options). The two maturity models and the remaining glossary conflicts are not resolved here.", who: Service owner}
- {id: OR-12, item: "The sector-depth assessment (DD-01 to DD-14) needs subject experts from each sector. Its source leads now link to the related rulebook entries, each labelled with how it was checked; leads with no entry are marked for checking.", who: Service owner, with sector data leads}
- {id: OR-13, item: "Done on 5 November 2026: description, homepage, topics, Discussions, private vulnerability reporting, Dependabot, secret push protection and approval for workflows from all external contributors. Still to do: a ruleset on main that blocks force pushes and deletion and requires the 'Build, check and publish' check.", who: Repository owner}
- {id: OR-14, item: "The Data Maturity Assessment framework is CC BY-NC-SA 4.0 and asks government users to contact CDDO. Confirm whether its level descriptions may be shown inside this portal; until then it is linked, not copied (F-05).", who: Service owner}
- {id: OR-15, item: "The explicit, implicit and inferred flags on the capability model are this portal's reading of the policy. Ask the GDS data policy team to confirm them, especially the inferred ones.", who: Service owner, with GDS Data Frameworks and Standards}
- {id: OR-16, item: "Done on 5 November 2026: Pages publishes the built site from the gh-pages branch. Still to do: set the default workflow token to read-only and stop GitHub Actions creating or approving pull requests; every workflow already declares the permissions it needs. Narrow installed GitHub Apps to the repositories each needs.", who: Repository owner}
- {id: OR-17, item: "Decide whether to rewrite the four commits credited to the unrelated 'noreply' account (D-021). It removes the false credit but changes their identifiers and needs a force push to main.", who: Repository owner}
- {id: OR-11, item: "Verified on GOV.UK: Table 4 of the issues framework contradicts its own rule for a 97.5% target (finding F-01). Raise with the GDS data quality team; tracked as a repository issue.", who: Service owner}

defects:
- {id: D-001, found: Prior governance suite (September 2026), defect: "DQAP was expanded with the wrong middle word, as an 'assurance' plan.", cause: "Expansion written from memory, not from the policy text.", check: "C-06 bans the wrong expansion anywhere in content or pages."}
- {id: D-002, found: Prior governance suite (September 2026), defect: "Evidence was mapped to a policy annex that does not exist.", cause: "An assumed reporting template was presented as fact.", check: "C-07 bans references to the non-existent annex."}
- {id: D-003, found: This build, source reading, defect: "The identification guidance page prints a team email address; copying source text risks putting it on the portal.", cause: "Source text carries contact details.", check: "C-04 fails the build on any email address in content or published files."}

- {id: D-004, found: This build, first browser run, defect: "Focusing a tab panel, table region or the graph filled the whole block with the yellow focus colour.", cause: "One focus rule targeted every element with a tabindex, including large containers.", check: "B-03 focuses each container type and fails if its background becomes the focus colour."}
- {id: D-005, found: This build, vaccination tests, defect: "The provenance check passed even when a requirement lost its label, because the source cell's own label satisfied it.", cause: "The check looked for a label anywhere in the row, not in the requirement cell.", check: "C-08 now inspects the requirement cell alone; its vaccination test removes that label and must fail."}
- {id: D-006, found: This build, first browser run, defect: "Every page scrolled sideways on 320 and 390 pixel screens.", cause: "The colophon barcode had a fixed pixel width.", check: "B-02 checks overflow at six widths from 320 to 1920 pixels."}
- {id: D-007, found: This build, first browser run, defect: "Links in the 'Met by' column were smaller than the 24 pixel target size.", cause: "Plain inline links set side by side in a table cell.", check: "B-01 runs axe with the WCAG 2.2 AA target-size rule in light and dark modes."}
- {id: D-008, found: This build (version 1.1), content review, defect: "A bulk rename of the portal's owner in the open register also renamed the data owner in the quality escalation table.", cause: "A pattern replacement matched role names inside the playbook methods.", check: "The build refuses any escalation row that names the portal's service owner; a vaccination test proves it."}
- {id: D-009, found: This build (version 1.1), first browser run, defect: "Module outcomes and persona goals containing commas were split into fragments such as 'Frame' and 'Assign'.", cause: "Unquoted commas inside YAML flow lists.", check: "The build refuses list items under three words; a vaccination test proves it."}
- {id: D-010, found: This build (version 1.1), static checks, defect: "The external-assets check treated canonical links as remote loads.", cause: "The check looked at every link element, not only ones the browser fetches.", check: "C-05 now ignores canonical and alternate links; its existing vaccination still fails on a remote script."}
- {id: D-011, found: This build (version 1.1), screenshot review, defect: "The contact form's first error link pointed to a radio button with no id, so it went nowhere.", cause: "The error summary is written by script, so the static link check could not see it.", check: "B-09 now checks every error summary link resolves to a field."}
- {id: D-012, found: First CI run on GitHub (version 1.1), defect: "The health step failed before running because its output folder did not exist on a fresh runner.", cause: "The build folder is ignored by git, so it exists locally but not in CI.", check: "The workflow creates the folder first; the CI run itself is the check and blocks publishing when it fails."}
- {id: D-013, found: First external link check (version 1.2), defect: "The health run reported a working GOV.UK organisation page as broken (HTTP 406).", cause: "Page checks asked for JSON before HTML, which some GOV.UK pages refuse.", check: "A unit test proves page checks ask for HTML first; it fails when the old header is restored."}
- {id: D-014, found: Browser checks (version 1.2), defect: "Stopping all table row headings from wrapping made the library, knowledge and policy pages scroll sideways on phones, and placed feature links too close together.", cause: "A global no-wrap rule applied to long titles as well as short identifiers.", check: "B-02 (sideways scrolling at six widths) and B-01 (target size) caught it; no-wrap now applies only to identifiers. A second cause was screen-reader-only labels inside wide tables escaping their scroll region; scroll regions are now positioned so they contain them."}
- {id: D-015, found: Browser checks (version 1.3), defect: "On the sectors page at 320 pixels, a filter drop-down sized itself to its longest option and pushed the page sideways.", cause: "Flex items in the filter bar kept their minimum content width.", check: "B-02 caught it before release; filter controls may now shrink to the screen width."}
- {id: D-016, found: Vaccination tests (version 1.4), defect: "The new check that every capability shows its explicit, implicit or inferred flag passed even when the flag was removed.", cause: "Signpost badges inside the card use the same style, so the check found those instead.", check: "C-22 now looks only in the card heading; the vaccination test that exposed it stays in the suite."}
- {id: D-017, found: Self-review before release 1.4, defect: "The repository's CITATION.cff was published empty in release 1.2.0, so GitHub showed no citation.", cause: "A version bump rewrote the file with a pattern that matched nothing and wrote back an empty result; no check looked at the file.", check: "C-23 now checks the citation file is complete and names the portal's version; two vaccination tests prove it fails on a blank file and on version drift."}
- {id: D-018, found: Release 1.4 deployment, defect: "Every workflow run since release 1.2.0 stopped before starting, so releases 1.2.0 to 1.4.0 were not published to GitHub Pages and CodeQL did not run.", cause: "The repository only allows actions owned by its owner and pinned to a full commit SHA; the workflows used GitHub's own actions by version tag. Confirmed from the run annotation.", check: "Workflows now use plain commands only (git checkout, the runner's Python and Node.js, the CodeQL command-line bundle checked against GitHub's published digest, and a push to the gh-pages branch). C-24 fails the build on any action the policy would refuse."}
- {id: D-019, found: Continuous integration after release 1.4, defect: "A single 504 from github.com was recorded as a broken link. The Status page then printed the repository address, which contains the owner's account name, so the personal-details check failed the build and blocked publishing.", cause: "The link check treated one server error as proof of a broken link, and the Status page quoted addresses verbatim.", check: "The link check retries three times and only counts 404 and 410 as broken; other failures are 'temporarily unavailable'. The Status page names the portal's repository by role. Two tests prove both. CodeQL's bundle download also retries."}
- {id: D-020, found: Review of repository settings after release 1.4, defect: "A suggested Jekyll workflow was added and Pages was set to publish from main, which would have published the raw repository files instead of the built portal.", cause: "GitHub's Pages settings offer a Jekyll starter workflow by default; nothing in the repository explained that the built site lives on gh-pages.", check: "C-24 refused the workflow (unpinned third-party actions) and the build failed safely. The workflow is removed, Pages publishes from gh-pages, and C-25 now fails if any workflow other than the three expected ones appears, or if any workflow publishes from the repository root."}
- {id: D-021, found: Owner report after release 1.4, defect: "GitHub listed an unrelated account called 'noreply' (location China) as a contributor. It never acted on the repository; four early commits were credited to it.", cause: "Automated build sessions committed with GitHub's generic noreply address under the username 'noreply', which GitHub links to the account with that username.", check: "C-26 fails the build if the latest commit uses any identity outside an allow-list of the owner, GitHub's bots and the named assistant. Removing the credit on GitHub itself needs those four commits rewritten (OR-17)."}
adversarial:
- {challenge: "Another portal adds to the scatter it claims to fix. Practitioners already describe the playbooks as 'published, none joined'.", answer: "It holds no second copy of anything with a master elsewhere. GOV.UK pages, the MEM and the Data Quality Commons are linked, not copied. What it adds is the join: the requirements matrix, one role model and the interlocks."}
- {challenge: "Readers will mistake this playbook's stage sequences for GOV.UK requirements.", answer: "Every requirement carries its source and strength (must, should, method, gap); stages are labelled as synthesis; provenance badges sit on every fact."}
- {challenge: "Base rate: catalogue programmes commonly stall on adoption rather than on tooling (K, a lead not a measured fact).", answer: "The method puts ownership before description and reporting from catalogue records, so effort lands where adoption fails. Whether that is enough is untested (OR-04)."}
- {challenge: "It is built before learning from users.", answer: "Named as a risk (OR-04). The journeys say they are assumed needs."}
- {challenge: "It is hosted outside an official organisation and is not cleared.", answer: "Stated on every page and in OR-03. The content is OGL and the code MIT, so it can move to an official organisation unchanged."}

# ---------------------------------------------------------------------------
# Page introductions (what each page is for, who it is for)
# ---------------------------------------------------------------------------
pages:
  personas: {lede: "Choose the role closest to yours. Each route shows what you need to learn, what to do and in what order, and tracks your progress as you go.", audience: Everyone using the playbooks}
  learning: {lede: "Short modules that build from the basics of the policy to running all three capabilities as one yearly cycle. Each module lists what you will be able to do, the activities, and a quick check of understanding.", audience: Anyone new to the policy or to a role in it}
  inclusion: {lede: "How the playbooks help you meet equality, diversity, inclusion and accessibility duties in your data work, and how this portal is designed so that everyone can use it.", audience: Everyone, especially data owners, stewards and governance boards}
  contact: {lede: "Ask a question, report a problem or suggest an improvement.", audience: Everyone}

# ---------------------------------------------------------------------------
# Personas: role-based, illustrative, not yet validated with users (OR-04)
# ---------------------------------------------------------------------------
personas:
- id: cdo
  title: Chief data officer
  icon: building-2
  role: CDO
  summary: You are accountable for adopting the policy across your organisation and, in a department, its arm's length bodies.
  context: You have little time, decide on resourcing and report progress to the Chief Data Officer Council. You need summaries first and detail on request.
  goals: ["Adopt the policy once, without the three capabilities duplicating effort", "Know your organisation's position at any time", "Show credible progress to the CDO Council"]
  needs:
  - {need: "see what the policy requires and who does what", so: "I can assign the work with confidence"}
  - {need: "a short, current view of progress", so: "I can unblock problems before the return is due"}
  pains: ["Governance, cataloguing and quality run by different teams record the same facts in different places", "Evidence is assembled in a rush at the deadline"]
  design_for: [Reads on a phone between meetings, Wants the summary before the detail]
  success: Every critical data asset has a named owner, a current catalogue record and a DQAP, and the return goes in on time.
  modules: [M01, M02, M03, M09, M10]
  journey:
  - {stage: Learn, tasks: [{m: M01}, {m: M02}]}
  - {stage: Prepare, tasks: [{p: gov.mandate, label: Agree the mandate and scope}, {p: cat.mobilise, label: Appoint the coordinating team}]}
  - {stage: Do, tasks: [{p: gov.assign, label: Confirm owners for every critical asset}, {p: cat.designate, label: Approve designation decisions}]}
  - {stage: Report, tasks: [{p: cat.report, label: Sign off the return to GDS}]}
  - {stage: Improve, tasks: [{p: gov.assure, label: Review assurance and refresh the mandate}, {m: M09}]}
- id: coo
  title: Lead policy coordinator
  icon: clipboard-list
  role: COO
  summary: You coordinate adoption day to day, collate and assure the return, and represent your organisation at the Working Group.
  context: You work across many teams, often alongside another role. You need one route from start to return and templates you can reuse.
  goals: [Get the baseline return right first time, Avoid retyping information that already exists, Keep arm's length bodies in step]
  needs:
  - {need: "one ordered route from mobilising to an assured return", so: "nothing is missed and nothing is done twice"}
  - {need: "templates that match what GDS asks for", so: "the return is collation, not reconstruction"}
  pains: [Requests arrive from several directions with different deadlines, Owners change and nobody updates the record]
  design_for: [Works compressed or part-time hours and picks tasks up after gaps, New to data management]
  success: An assured return goes in on time, built from catalogue records rather than retyped.
  modules: [M01, M02, M04, M06, M09, M10]
  journey:
  - {stage: Learn, tasks: [{m: M01}, {m: M04}]}
  - {stage: Prepare, tasks: [{p: cat.mobilise, label: Set up the team and ALB contacts}, {p: cat.discover, label: Build the candidate list}]}
  - {stage: Do, tasks: [{p: cat.designate, label: Run designation}, {p: cat.own, label: Confirm owners and contact points}, {p: cat.describe, label: Get records completed}]}
  - {stage: Report, tasks: [{p: cat.report, label: Prepare and assure the return}]}
  - {stage: Improve, tasks: [{p: cat.maintain, label: Schedule the annual review}, {m: M09}]}
- id: own
  title: Data owner
  icon: key-round
  role: OWN
  summary: You are the senior leader accountable for the meaning, content, quality and management of one or more critical data assets.
  context: Data ownership is one of several responsibilities. You make decisions and sign off; others do the day-to-day work.
  goals: [Understand exactly what you are accountable for, Make decisions quickly with the right evidence, Name a successor so the asset is never orphaned]
  needs:
  - {need: "a clear list of the decisions that are mine", so: "I can sign off with confidence"}
  - {need: "to see how good my data is and what it should not be used for", so: "I can accept or reject risks knowingly"}
  pains: [Unclear difference between data owner and information asset owner, Asked to sign things without the context]
  design_for: [Uses screen magnification at 200 per cent, Prefers checklists to long text]
  success: You can explain your assets' purpose, quality and risks, and your successor is named.
  modules: [M01, M02, M07, M10]
  journey:
  - {stage: Learn, tasks: [{m: M01}, {m: M02}]}
  - {stage: Prepare, tasks: [{p: gov.assign, label: Accept the role and name a successor}]}
  - {stage: Do, tasks: [{p: dq.define, label: Agree quality targets}, {p: dq.prioritise, label: Decide priorities and accept risks}]}
  - {stage: Report, tasks: [{p: dq.report, label: Approve the data quality statement}]}
  - {stage: Improve, tasks: [{p: dq.review, label: Hold the annual review}, {m: M07}]}
- id: stw
  title: Data steward
  icon: user-cog
  role: STW
  summary: You run critical data assets day to day - their standards, access, metadata and quality processes.
  context: You do the detailed work and keep the records current. You need step-by-step methods and templates.
  goals: [Keep the catalogue record and the DQAP current without heroics, Find problems before users do, Hand over cleanly when you move on]
  needs:
  - {need: "step-by-step instructions with templates", so: "I can do the work consistently across assets"}
  - {need: "one place to record each fact once", so: "the catalogue, the DQAP and the register always agree"}
  pains: [The same owner and review date recorded in three places, Quality rules kept only in one tool]
  design_for: [Dyslexic and prefers short steps, Uses a screen reader for long documents]
  success: Every asset you steward has a current record, rules with targets, and a quality statement users understand.
  modules: [M01, M05, M07, M08, M10]
  journey:
  - {stage: Learn, tasks: [{m: M05}, {m: M07}]}
  - {stage: Prepare, tasks: [{p: dq.identify, label: Agree critical data elements}, {p: cat.describe, label: Complete the catalogue record}]}
  - {stage: Do, tasks: [{p: dq.define, label: Write rules and targets}, {p: dq.baseline, label: Measure a baseline}, {p: dq.improve, label: Fix causes at source}]}
  - {stage: Report, tasks: [{p: dq.report, label: Publish the quality statement}]}
  - {stage: Improve, tasks: [{p: dq.sustain, label: Automate checks}, {m: M08}]}
- id: cat
  title: Catalogue manager or data custodian
  icon: database
  role: CAT
  summary: You run the catalogue and the systems behind it, so records can be found, harvested and kept accurate.
  context: You work with tools and standards. You need to know what any catalogue must expose, whatever the product.
  goals: ["Records that machines can harvest, not only people", "Conform to the cross-government metadata standard", "Avoid lock-in to one product"]
  needs:
  - {need: "the exact metadata properties and how they map to the standard", so: "records conform first time"}
  - {need: "to know what the Discoverability Platform will expect", so: "we do not rebuild the feed later"}
  pains: [Guidance and model do not list the same properties, Internal-only links break outside the organisation]
  design_for: [Works mainly by keyboard, English is an additional language]
  success: Every critical data asset record is complete, conforms to the standard and can be harvested as DCAT.
  modules: [M01, M05, M06, M10]
  journey:
  - {stage: Learn, tasks: [{m: M05}, {m: M06}]}
  - {stage: Prepare, tasks: [{p: cat.discover, label: Search existing registers}]}
  - {stage: Do, tasks: [{p: cat.describe, label: Configure record fields}, {p: cat.publish, label: Expose records as DCAT}]}
  - {stage: Report, tasks: [{p: cat.report, label: Produce the return from records}]}
  - {stage: Improve, tasks: [{p: cat.maintain, label: Keep records current}]}
- id: dql
  title: Data quality lead or analyst
  icon: chart-line
  role: DQL
  summary: You bring methods and tools for measuring and improving quality across many assets.
  context: You support several stewards. You need a consistent scoring method and tools that work without installing anything.
  goals: [Score issues the same way across assets, Automate measurement across assets, Show quality fairly for every group the data describes]
  needs:
  - {need: "the government scoring method and tools that apply it", so: "priorities are consistent and defensible"}
  - {need: "checks that break results down by group", so: "poor quality for some people is not averaged away"}
  pains: [Every team scores issues differently, Quality reported as one average]
  design_for: ["Colour-blind, so charts must not rely on colour alone", "Works across several devices"]
  success: Every critical data asset has scored issues, automated checks and quality reported by group where lawful.
  modules: [M01, M07, M08, M09, M10]
  journey:
  - {stage: Learn, tasks: [{m: M07}, {m: M08}]}
  - {stage: Prepare, tasks: [{p: dq.define, label: Build the rule library}]}
  - {stage: Do, tasks: [{p: dq.baseline, label: Run baselines}, {p: dq.prioritise, label: Score and rank issues}]}
  - {stage: Report, tasks: [{p: dq.report, label: Publish quality metadata}]}
  - {stage: Improve, tasks: [{p: dq.sustain, label: Automate and monitor}, {m: M10}]}

# ---------------------------------------------------------------------------
# Learning modules
# ---------------------------------------------------------------------------
modules:
- id: M01
  title: The DAM Policy - what it asks of you
  level: Foundation
  minutes: 15
  icon: landmark
  caps: [gov, cat, dq]
  outcomes: ["Explain who the policy applies to and what is in scope", "Name the core duties: identify and catalogue assets, report them, name an owner and manage quality", "Find the requirement behind any step in these playbooks"]
  activities:
  - {id: a1, type: Read, text: "Read the summary of who the policy applies to and what is in scope.", link: dam.html#scope}
  - {id: a2, type: Read, text: "Scan the requirements table. Filter it to 'must' to see the core duties.", link: dam.html#requirements}
  - {id: a3, type: Do, text: "Note which of the reporting dates applies to your organisation first.", link: dam.html#timeline}
  - {id: a4, type: Reflect, text: "Which of the three capabilities is least developed in your organisation today?"}
  check:
  - {q: "Which organisations must follow the policy?", options: [All public bodies including councils, UK government departments and their arm's length bodies, Only departments that publish open data], answer: 1, why: "It applies to UK government departments and their ALBs. It is optional for public corporations and does not apply to councils."}
  - {q: "What must every identified data asset have?", options: [A named data owner and a DQAP or equivalent, An open data licence, A dedicated catalogue product], answer: 0, why: "The policy requires a named data owner and a data quality action plan, or an equivalent mechanism, for every identified asset."}
- id: M02
  title: Roles and accountability
  level: Foundation
  minutes: 15
  icon: users-round
  caps: [gov]
  outcomes: ["Describe the data owner, data steward and data custodian roles", "Explain how the data owner relates to the information asset owner", "Choose between the three ownership options"]
  activities:
  - {id: a1, type: Read, text: "Read the role model shared by all three playbooks.", link: together.html#roles}
  - {id: a2, type: Read, text: "Read the Assign recipe and its checklist.", link: governance.html#gov-assign}
  - {id: a3, type: Do, text: "List your critical data assets and the role that should own each one."}
  - {id: a4, type: Reflect, text: "Does every owner in your list have a named successor?"}
  check:
  - {q: "Which role is accountable for an asset's meaning, content and quality?", options: [Data custodian, Data steward, Data owner], answer: 2, why: "The data owner is the senior leader accountable. The steward runs the asset day to day; the custodian runs the technical system."}
  - {q: "What must happen when a data owner leaves?", options: [The asset is retired, A successor is ready and the metadata is updated, The steward becomes owner automatically], answer: 1, why: "The guidance asks you to tell the coordinating team, have a successor ready and update the metadata."}
- id: M03
  title: Setting up governance with five recipes
  level: Practitioner
  minutes: 30
  icon: shield-check
  caps: [gov]
  outcomes: ["Run the Mandate, Frame, Assign, Operate and Assure recipes in order", "Set up a decision log and an exception register", "Collect evidence continuously for the GDS return"]
  activities:
  - {id: a1, type: Read, text: "Work through the five recipes step by step.", link: governance.html#method}
  - {id: a2, type: Do, text: "Draft a one-page charter using the template.", link: governance.html#T-GOV-1}
  - {id: a3, type: Do, text: "Set up a decision log and an exception register using the templates.", link: governance.html#T-GOV-3}
  - {id: a4, type: Reflect, text: "Where will your evidence folder live, and who keeps it current?"}
  check:
  - {q: "What makes an exception different from a policy change?", options: [It has an owner and an expiry date, It is approved by the minister, It applies to all assets], answer: 0, why: "An exception is time-bound with an owner and an expiry date. Without an expiry it is an undocumented policy change."}
  - {q: "When should you assemble evidence for the return?", options: [In the month before the deadline, Continuously during Operate, Only after an audit], answer: 1, why: "Collecting evidence each time a decision is logged turns the return into collation rather than reconstruction."}
- id: M04
  title: Finding and designating critical data assets
  level: Practitioner
  minutes: 25
  icon: search
  caps: [cat]
  outcomes: [Build a candidate list from existing registers, Apply the scope tests and the seven purposes, Draw an asset's boundary and record why]
  activities:
  - {id: a1, type: Read, text: "Read stages 1 to 3 of the cataloguing method.", link: cataloguing.html#method}
  - {id: a2, type: Do, text: "Start a candidate log using the designation template.", link: cataloguing.html#T-CAT-1}
  - {id: a3, type: Do, text: "For one candidate, record which of the seven purposes it supports.", link: dam.html#DAM-R11}
  - {id: a4, type: Reflect, text: "Have you looked at data you acquire from others, not only data you provide?"}
  check:
  - {q: "If you designate a distribution of a data set, what else should you designate?", options: [Nothing else, Its source data set, Every system that uses it], answer: 1, why: "The guidance asks you to designate the source data set as well."}
  - {q: "Which of these is one of the seven purposes?", options: [Marketing, Official statistics, Staff training], answer: 1, why: "Official statistics is one of the seven. The statistics themselves are not designated, only the data used to produce them."}
- id: M05
  title: Describing assets with metadata others can use
  level: Practitioner
  minutes: 30
  icon: pencil-line
  caps: [cat]
  outcomes: [Record the metadata properties in the GOV.UK guidance, Write titles and descriptions in plain English, Map properties to the Metadata Exchange Model]
  activities:
  - {id: a1, type: Read, text: "Read the metadata properties and how to record each one.", link: cataloguing.html#metadata}
  - {id: a2, type: Do, text: "Complete a catalogue record for one asset using the template.", link: cataloguing.html#T-CAT-2}
  - {id: a3, type: Do, text: "Ask someone outside your team to read the record and say what the data is for."}
  - {id: a4, type: Reflect, text: "Which properties did you have to mark 'unknown'? Who could supply them?"}
  check:
  - {q: "How should you record a date in a catalogue record?", options: [As written in the source system, In ISO 8601 format, In words], answer: 1, why: "The guidance asks for ISO 8601, for example 2020-07-14."}
  - {q: "What should you put when a property has no value?", options: [Leave it blank, "'unknown' or 'not applicable'", A dash], answer: 1, why: "Use 'unknown' or 'not applicable' rather than leaving a blank."}
- id: M06
  title: Cataloguing, harvesting and reporting to GDS
  level: Practitioner
  minutes: 20
  icon: share-2
  caps: [cat]
  outcomes: [Expose records so others can harvest them, Produce the return from catalogue records, Plan the annual review]
  activities:
  - {id: a1, type: Read, text: "Read stages 6 to 8 of the cataloguing method.", link: cataloguing.html#cat-publish}
  - {id: a2, type: Do, text: "Check that every link in one record works from outside your network."}
  - {id: a3, type: Do, text: "Put the annual review date in the same diary entry as the DQAP review.", link: together.html#cycle}
  check:
  - {q: "How often must metadata be reviewed?", options: [Every 3 years, At least every 12 months, Only when the asset changes], answer: 1, why: "The policy asks for metadata to be maintained and reviewed annually."}
  - {q: "Who assures the returns of arm's length bodies?", options: [GDS, Their department, Each ALB alone], answer: 1, why: "Departments coordinate and assure the returns of their ALBs."}
- id: M07
  title: Data quality foundations
  level: Foundation
  minutes: 15
  icon: gauge
  caps: [dq]
  outcomes: [Name the five principles and six dimensions of the Government Data Quality Framework, Explain what a DQAP is for, Recognise when quality differs between groups of people]
  activities:
  - {id: a1, type: Read, text: "Read the principles and dimensions.", link: quality.html#principles}
  - {id: a2, type: Read, text: "Read the overview of the quality playbook.", link: quality.html#overview}
  - {id: a3, type: Reflect, text: "Which dimension matters most for your most important decision?"}
  check:
  - {q: "Which is one of the six dimensions?", options: [Popularity, Timeliness, Size], answer: 1, why: "The six are completeness, uniqueness, consistency, timeliness, validity and accuracy."}
  - {q: "Why break quality results down by group?", options: [To make reports longer, So poor quality for some people is not averaged away, Because the law always requires it], answer: 1, why: "An average can hide poor quality for some groups, which can exclude them from services."}
- id: M08
  title: Building a DQAP and scoring issues
  level: Practitioner
  minutes: 35
  icon: list-ordered
  caps: [dq]
  outcomes: [Write rules with targets from the issues framework, Measure a baseline and log issues, Prioritise issues and set resolution dates]
  activities:
  - {id: a1, type: Read, text: "Work through the eight quality stages step by step.", link: quality.html#method}
  - {id: a2, type: Do, text: "Write three rules for one critical data element using the template.", link: quality.html#T-DQ-1}
  - {id: a3, type: Do, text: "Score an issue with the issues framework calculator.", link: https://cyberdudeuk.github.io/dq-commons/guidance.html}
  - {id: a4, type: Reflect, text: "Which issue would you fix at source rather than clean downstream?"}
  check:
  - {q: "How does the issues framework set a rule's target range?", options: [From what the data already achieves, From importance of purpose times impact, From the size of the data set], answer: 1, why: "Importance of purpose multiplied by impact gives a combined score, which sets the target range."}
  - {q: "In the framework's example timescales, when is a critical issue resolved?", options: [Immediately, Within three measurements, Within six measurements], answer: 0, why: "The framework's example gives Critical as immediate; High, Medium and Low within 1, 3 and 6 measurements."}
- id: M09
  title: Running the three capabilities as one yearly cycle
  level: Advanced
  minutes: 20
  icon: refresh-cw
  caps: [gov, cat, dq]
  outcomes: [Use the hand-offs so each fact is recorded once, Plan one annual review per asset, Feed assurance lessons into the next mandate]
  activities:
  - {id: a1, type: Read, text: "Read the hand-offs between the capabilities.", link: together.html#interlocks}
  - {id: a2, type: Read, text: "Read the joined-up year.", link: together.html#cycle}
  - {id: a3, type: Do, text: "Pick one asset and check the owner is the same in the register, the record and the DQAP."}
  check:
  - {q: "Where should the owner and successor for an asset be recorded first?", options: [In the DQAP, "In the ownership register, then reused", Separately in each tool], answer: 1, why: "The ownership register is the source; the catalogue record and the DQAP reuse it (IL-01, IL-02)."}
- id: M10
  title: Inclusive data practice
  level: Foundation
  minutes: 20
  icon: heart-handshake
  caps: [gov, cat, dq]
  outcomes: [Apply equality and inclusion checks in each capability, Make data quality statements and records accessible, Involve people the data describes]
  activities:
  - {id: a1, type: Read, text: "Read the inclusion checks for each capability.", link: inclusion.html#checks}
  - {id: a2, type: Do, text: "Run the inclusion questions against one of your assets.", link: inclusion.html#questions}
  - {id: a3, type: Reflect, text: "Whose voice is missing when you decide what 'good enough' means?"}
  check:
  - {q: "Which duty asks public bodies to consider equality in their work?", options: [The public sector equality duty, The Freedom of Information Act, The Statistics and Registration Service Act], answer: 0, why: "The public sector equality duty in the Equality Act 2010 applies to public authorities in their functions."}

- id: M11
  title: Embedding the policy in delivery and change
  level: Practitioner
  minutes: 30
  icon: construction
  caps: [gov, cat, dq]
  outcomes: [Name the capabilities the policy relies on but does not state, Build DAM checkpoints into a business case and an assurance plan, Plan a legacy exit and a handover to business as usual]
  activities:
  - {id: a1, type: Read, text: "Read what the policy leaves to you and the life cycle overlay.", link: change.html#gaps}
  - {id: a2, type: Do, text: "Take one programme you know and tick the actions that already happen, then list the gaps.", link: change.html#practices}
  - {id: a3, type: Do, text: "Run the self-assessment for your organisation and download the result.", link: capability-model.html#cm-self}
  - {id: a4, type: Reflect, text: "Which critical asset would be left without an owner if its project closed tomorrow?"}
  check:
  - {q: "Which guidance makes a register of data assets its second principle?", options: [Managing legacy technology, The Magenta Book, The Service Standard], answer: 0, why: "The GOV.UK guidance on managing legacy technology asks organisations to build a complete and accurate register of their data assets."}
  - {q: "How does the capability model flag a need the DAM Policy text does not state at all?", options: [Inferred, Implicit, Explicit], answer: 0, why: "Inferred means the need is not in the text and comes from good practice and adjacent rulebooks."}

# ---------------------------------------------------------------------------
# Inclusion (diversity, equity, equality, inclusion and accessibility)
# ---------------------------------------------------------------------------
inclusion:
  duties:
  - {name: Public sector equality duty (Equality Act 2010), text: "Have due regard to eliminating discrimination, advancing equality of opportunity and fostering good relations, across the protected characteristics.", prov: K}
  - {name: Public Sector Bodies Accessibility Regulations 2018, text: "Websites and documents you publish, including data quality statements and catalogue pages, must meet accessibility requirements.", prov: K}
  - {name: UK GDPR accuracy principle, text: "Personal data must be accurate and, where necessary, kept up to date. Inaccuracy can fall harder on some groups.", prov: P}
  - {name: Welsh Language Standards and devolved duties, text: "Where your organisation is subject to them, statements and records meant for the public must meet them.", prov: K}
  checks:
  - {cap: gov, items: ["Include equality considerations in the charter and the board's terms of reference", "Make sure owners and stewards have accessible training and materials", "Record decisions that affect groups differently, with the equality analysis behind them", "Invite representatives of people the data describes when the board sets priorities"]}
  - {cap: cat, items: ["Write titles and descriptions in plain English and expand acronyms", "Record known gaps in coverage - people, places or periods the data misses", "Check address, name and identifier fields work for all four UK nations and overseas", "Make sure catalogue pages and records meet accessibility requirements"]}
  - {cap: dq, items: ["Break quality results down by group where you lawfully can", "Record poorer quality for a group as its own issue, so it is not averaged away", "Fix forms that force wrong answers, such as no 'prefer not to say' or one-line names", "Test quality statements with people outside the data team, and offer accessible formats"]}
  questions:
  - Does the data cover everyone it should? Compare its coverage with an independent count by group and place.
  - Is missing or wrong data worse for some groups?
  - Can people describe themselves accurately in the forms and systems that create the data?
  - Do rules and records work for all four UK nations, and for Welsh language users where required?
  - Are the outputs (records, statements, reports) accessible and in plain English?
  - Have people the data describes, or their representatives, had a say?
  - If the data feeds automated decisions or AI, has bias been assessed?
  portal:
  - Plain English, short sections, sentence case and a summary at the top of every page
  - Works with a keyboard, screen readers and magnification; tested automatically against WCAG 2.2 AA
  - Light and dark modes, larger text and wider line spacing, chosen in display options
  - No information conveyed by colour alone; every chart and graph has a table equivalent
  - Pages still work with scripts turned off; progress tracking is an optional extra
  - Progress is kept only in your own browser; nothing about you is collected

# ---------------------------------------------------------------------------
# Where the playbooks need more specific sector or domain content (assessment, version 1.1)
# MoSCoW is for the next releases of this portal. Named sources are leads (K) until verified.
# ---------------------------------------------------------------------------
domain_depth:
- id: DD-01
  theme: Health and care data
  sectors: [NHS England and health bodies, Department of Health and Social Care ALBs]
  caps: [gov, cat, dq]
  moscow: Must
  why: Health bodies hold many critical data assets about people, often with legal duties beyond the DAM Policy. Quality failures here fall hardest on people who already face health inequalities.
  needed: ["Map data owner and steward roles to Caldicott guardians, SIROs and clinical safety officers", "Quality rules for clinical coding (SNOMED CT, ICD-10, OPCS-4) and NHS number validity", "Read-across to the NHS Data Security and Protection Toolkit and the national data opt-out", "A worked example of a DQAP for a patient-level data set"]
  leads: [NHS Data Quality Maturity Index, NHS Data Dictionary, Data Security and Protection Toolkit, DCB0129 and DCB0160 clinical safety standards, Caldicott principles]
- id: DD-02
  theme: Adult and children's social care data
  sectors: [Local authorities (voluntary adoption), Department of Health and Social Care, Department for Education]
  caps: [cat, dq]
  moscow: Should
  why: Social care data flows from councils to central government, so critical data assets depend on systems outside the policy's scope, often legacy case management systems.
  needed: ["Guidance for assets acquired from councils that are not bound by the policy", "Quality rules for client level data returns and outcomes frameworks", "Handling legacy system exports and cross-boundary records"]
  leads: [Adult social care client level data, Adult Social Care Outcomes Framework, Children in need census, Children looked after return]
- id: DD-03
  theme: Geospatial and address data
  sectors: [Geospatial Commission, Ordnance Survey, HM Land Registry, environment bodies]
  caps: [cat, dq]
  moscow: Must
  why: The metadata guidance names GEMINI for geospatial data, and most critical data assets carry an address or location that needs a shared identifier.
  needed: ["GEMINI metadata alongside the core properties, with a crosswalk", "Rules for UPRN and USRN validity and match rates", "Positional and thematic accuracy checks (ISO 19157)", "Q-FAIR quality ratings in catalogue records"]
  leads: [UK GEMINI metadata standard, UPRN and USRN open identifiers, ISO 19157 geographic data quality, Geospatial Commission Q-FAIR]
- id: DD-04
  theme: Official statistics and administrative data
  sectors: [Office for National Statistics, departmental statistics teams, Office for Statistics Regulation]
  caps: [dq, cat]
  moscow: Should
  why: Official statistics is one of the seven purposes. The data used to produce statistics is designated, and its quality is also judged under the Code of Practice for Statistics.
  needed: ["Read-across between the DQAP and quality assurance of administrative data (QAAD)", "Statistical metadata (SDMX) alongside DCAT", "How to report quality once for both the DAM return and statistical quality reports"]
  leads: [Code of Practice for Statistics, Quality assurance of administrative data (QAAD), SDMX]
- id: DD-05
  theme: Data sharing and legal gateways
  sectors: [All departments]
  caps: [gov]
  moscow: Must
  why: Critical data assets are defined by being shared. Owners need to know the legal basis for each flow, which changed with the Data (Use and Access) Act 2025.
  needed: ["A legal gateway field and decision record in the governance templates", "Read-across to data sharing agreements and the ICO data sharing code", "What the Data (Use and Access) Act 2025 changes for owners"]
  leads: [Data (Use and Access) Act 2025, Digital Economy Act 2017 data sharing powers, ICO data sharing code of practice]
- id: DD-06
  theme: AI-ready data
  sectors: [All departments using data for AI or automated decision support]
  caps: [dq, gov, cat]
  moscow: Must
  why: The annual review asks whether new uses include AI. Owners need criteria, not just a prompt.
  needed: ["An AI-readiness checklist mapped to quality dimensions and catalogue fields", "When an algorithmic transparency record is needed", "Bias and representativeness rules for training data"]
  leads: [GDS guidelines on making government datasets ready for AI, Algorithmic Transparency Recording Standard, ISO/IEC 5259 data quality for analytics and machine learning]
- id: DD-07
  theme: Tax, benefits and fraud and error
  sectors: [HMRC, DWP, Public Sector Fraud Authority]
  caps: [gov, dq]
  moscow: Should
  why: Fraud and error is one of the seven purposes. These assets combine high volume, personal data and decisions about people.
  needed: ["Quality rules for identity matching and false positives", "Governance for data used in fraud detection, including review of automated flags"]
  leads: [Public Sector Fraud Authority guidance, Digital Economy Act 2017 fraud powers]
- id: DD-08
  theme: Justice, policing and national security
  sectors: [Ministry of Justice, Home Office, police, defence]
  caps: [gov, cat]
  moscow: Could
  why: Only OFFICIAL assets are in scope, and law enforcement processing follows Part 3 of the Data Protection Act 2018. Owners need to know where the line falls.
  needed: ["How to describe an asset whose metadata is itself sensitive", "Handling markings in catalogue records", "Roles where vetting applies"]
  leads: [Data Protection Act 2018 Part 3, Government Security Classifications Policy]
- id: DD-09
  theme: Person, identity and vulnerability data standards
  sectors: [All departments holding data about people]
  caps: [cat, dq]
  moscow: Should
  why: Draft cross-government standards for person and vulnerability data affect how assets are described and checked.
  needed: ["Link catalogue fields and quality rules to the person data standard when it is published", "Inclusive rules for names, sex and gender questions and 'prefer not to say' options"]
  leads: [Person data standard (alpha), Vulnerabilities data standard (alpha), ONS harmonised standards]
- id: DD-10
  theme: Reference and master data
  sectors: [All departments]
  caps: [gov, cat, dq]
  moscow: Should
  why: Code lists and authoritative identifiers make assets interoperable, but the policy does not yet list which to use (OR-05).
  needed: ["A register of recommended identifiers and code lists by domain", "Ownership patterns for shared reference data"]
  leads: [Open Standards Board recommended standards, GOV.UK registers and code lists]
- id: DD-11
  theme: Records, retention and disposal
  sectors: [All departments; knowledge and information management teams]
  caps: [gov]
  moscow: Should
  why: The Frame recipe lists retention and disposal, but owners need the link between data assets and records management schedules.
  needed: ["Retention fields in the ownership register", "Read-across to The National Archives guidance"]
  leads: [The National Archives information management guidance]
- id: DD-12
  theme: Devolved governments and local government
  sectors: [Scottish Government, Welsh Government, Northern Ireland Executive, local authorities]
  caps: [gov, cat, dq]
  moscow: Should
  why: The policy does not bind them, but many critical data assets flow to or from them. Pan-UK assets need each nation's view.
  needed: ["A four-nations view of equivalent policies and standards", "Bilingual (Welsh) catalogue and quality statement guidance where it applies", "Voluntary adoption route for councils"]
  leads: [Scottish Government data standards, Welsh Language Standards, Local Digital Declaration]
- id: DD-13
  theme: Environment, agriculture and land
  sectors: [Defra group, environment agencies]
  caps: [cat, dq]
  moscow: Could
  why: Large holders of shared spatial and monitoring data, with sensor and time-series quality issues the core rules do not cover.
  needed: ["Timeliness and completeness rules for sensor and time-series data", "Metadata aligned with INSPIRE"]
  leads: [INSPIRE metadata, ISO 19157]
- id: DD-14
  theme: Education and skills
  sectors: [Department for Education and its ALBs]
  caps: [dq]
  moscow: Could
  why: Pupil and learner records are long-lived and linked across services.
  needed: ["Quality rules for unique pupil and learner identifiers", "Coverage checks across school types and nations"]
  leads: [School census, Learning Records Service]

# ---------------------------------------------------------------------------
# Assessment against the reusable build manifest (self-routines SR and practices OP), version 1.1
# MoSCoW is for this portal as a G3 portal; status is what is actually in place in this release.
# ---------------------------------------------------------------------------
standards:
- {id: SR03, name: Self-describing, moscow: Must, status: Met, how: "Artefact meta tags, JSON-LD on every page, DCAT catalogue, SKOS vocabulary, sitemap"}
- {id: SR07, name: Self-testing, moscow: Must, status: Met, how: "Static and browser checks on every change; each check proved to fail on a deliberate break; release blocked on failure"}
- {id: SR18, name: Self-degrading, moscow: Must, status: Met, how: "Declared shed order in app.js; every page readable with scripts off (browser check B-07)"}
- {id: SR26, name: Self-updating, moscow: Must, status: Met, how: "Weekly health run re-checks every source date through the GOV.UK Content API and every external link, and reports changes on the Status page"}
- {id: SR09, name: Self-reviewing, moscow: Must, status: Met, how: "Weekly health run fails when the review date has passed and opens an issue"}
- {id: SR33, name: Self-reporting, moscow: Must, status: Met, how: "status.json and the Status page publish health, coverage and open problems; failures open a GitHub issue"}
- {id: SR32, name: Self-limiting, moscow: Must, status: Met, how: "Automation only reads, builds and opens issues. A person merges, tags releases and changes settings"}
- {id: SR23, name: Self-securing, moscow: Must, status: Partly, how: "Content Security Policy, CodeQL, Dependabot alerts and secret scanning. Branch protection to be switched on by the repository owner"}
- {id: SR34, name: Self-costing, moscow: Must, status: Met, how: "Health run measures page weight against a 1.5 MB per page envelope; CI minutes are free for public repositories"}
- {id: SR02, name: Self-reconciling, moscow: Should, status: Met, how: "Build refuses broken references between requirements, steps, roles, modules and sources; counts are computed, never typed"}
- {id: SR04, name: Self-documenting, moscow: Should, status: Met, how: "What's new page generated from the changelog; release notes generated by GitHub releases"}
- {id: SR10, name: Self-profiling, moscow: Should, status: Partly, how: "Page weight measured; no measurement of where users wait, because no analytics are collected"}
- {id: SR31, name: Self-explaining, moscow: Should, status: Met, how: "Search ranking rule and progress rules explained on the About page; every fact carries a provenance label"}
- {id: SR29, name: Self-calibrating, moscow: Could, status: Not yet, how: "Learning time estimates are not yet compared with real completion times"}
- {id: OP01, name: Architecture decisions recorded, moscow: Must, status: Met, how: "docs/adr"}
- {id: OP05, name: Protected main branch with review, moscow: Must, status: Partly, how: "Pull request template and CODEOWNERS in place; the owner must switch on branch protection"}
- {id: OP06, name: Negative tests prove each check, moscow: Must, status: Met, how: "tests/test_checks.py and browser vaccinations in CI"}
- {id: OP07, name: Accessibility tested automatically, moscow: Must, status: Met, how: "axe-core, WCAG 2.2 AA, light and dark, six widths"}
- {id: OP08, name: Dependencies pinned and updated on a clock, moscow: Should, status: Met, how: "Exact pins; Dependabot weekly; GitHub dependency graph provides the bill of materials"}
- {id: OP10, name: Continuous integration on every change, moscow: Must, status: Met, how: "Build, check and publish workflow"}
- {id: OP11, name: Release train and checklist, moscow: Must, status: Met, how: "Tag-triggered release workflow and the release checklist in docs/RUNBOOK.md"}
- {id: OP13, name: Scheduled health run with alert, moscow: Must, status: Met, how: "Weekly health workflow; failures open or update a labelled issue"}
- {id: OP16, name: Runbooks, moscow: Must, status: Met, how: "docs/RUNBOOK.md"}
- {id: OP20, name: No single person or account the portal depends on, moscow: Must, status: Not yet, how: "Hosted on one personal account; move to an official organisation (OR-03)"}
