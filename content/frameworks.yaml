change:
  stages:
  - id: plan
    name: Strategy and business case
    icon: banknote
  - id: discover
    name: Discovery
    icon: search
  - id: alpha
    name: Alpha
    icon: pencil-line
  - id: beta
    name: Beta and build
    icon: wrench
  - id: live
    name: Live and business as usual
    icon: activity
  - id: retire
    name: Migrate or retire
    icon: archive
  touchpoints:
    plan:
    - List the critical data assets the change will create, change, depend on or retire.
    - Cost ownership, cataloguing and quality work in the economic and financial cases.
    - Add data asset risks to the programme risk register.
    discover:
    - Check the catalogue for assets that already meet the need before collecting new data.
    - Agree who will own each new or changed asset.
    alpha:
    - Design metadata and quality rules alongside the data model.
    - Run a data protection impact assessment where personal data is involved.
    beta:
    - Catalogue new assets before go-live, with the core metadata.
    - Write and test the DQAP; reconcile migrated data against the source.
    live:
    - Hand ownership, the DQAP and the runbook to named people in business as usual.
    - Report the asset in the next annual return.
    retire:
    - Start from the asset register; decide to migrate, archive or dispose of each asset.
    - Update or close catalogue entries and transfer ownership formally.
  items:
  - id: CH-01
    title: Put data assets in the business case
    icon: banknote
    mode: Change
    stage: plan
    why: The policy says data must be valued and invested in; business cases are where that money is decided.
    actions:
    - Name each critical data asset in scope of the change in the strategic case.
    - Cost owner, steward and catalogue effort and DQAP remediation in the financial case.
    - Count avoided duplicate collection and cleansing as benefits in the economic case.
    - Name the data owner in the management case.
    evidence:
    - Asset list in the business case
    - Costed DAM activities
    - Named owners
    roles:
    - CDO
    - OWN
    - COO
    - SRO
    refs:
    - RB-GREEN
    - RB-AQUA
    cr:
    - CR-24
    prov: O
  - id: CH-02
    title: Use spend control and service assessments as checkpoints
    icon: stamp
    mode: Change
    stage: alpha
    why: Spend control and service assessments already stop work that is not ready; adding DAM evidence costs little.
    actions:
    - 'Add three questions to internal spend control: which assets, who owns them, are they catalogued.'
    - At alpha, show the planned metadata and quality rules; at beta, the catalogue entry and DQAP.
    - Record the answers so the next return reuses them.
    evidence:
    - Spend control submission notes
    - Assessment evidence pack
    roles:
    - COO
    - CAT
    - DQL
    - SVO
    refs:
    - RB-SPEND
    - RB-SVCASSESS
    - RB-TCOP
    - RB-SVC
    cr:
    - CR-25
    prov: O
  - id: CH-03
    title: Write DAM into programme assurance
    icon: clipboard-check
    mode: Change
    stage: plan
    why: Large programmes have integrated assurance plans; DAM checks in them are reviewed with everything else.
    actions:
    - Add DAM checkpoints to the integrated assurance and approval plan.
    - Ask reviewers to check asset ownership, catalogue entries and quality plans at each gate.
    - Give the senior responsible owner a single line on data asset readiness in highlight reports.
    evidence:
    - Assurance plan entries
    - Gate review findings
    roles:
    - CDO
    - BRD
    - SRO
    - PMO
    refs:
    - RB-IAAP
    - RB-NISTA
    - RB-GMPP
    - RB-GOVS002
    cr:
    - CR-25
    - CR-03
    prov: O
  - id: CH-04
    title: Plan legacy exits from the asset register
    icon: construction
    mode: Change
    stage: retire
    why: Legacy systems hold large concentrations of hard-to-reach data; the legacy guidance asks for an asset register first.
    actions:
    - Build or update the register of data assets held in the legacy system.
    - Profile quality before migration and set reconciliation rules for counts, totals and keys.
    - 'Decide for each asset: migrate, archive under records rules, or dispose.'
    - Keep the catalogue and ownership in step as each asset moves.
    evidence:
    - Asset register for the system
    - Profiling and reconciliation results
    - Disposition decisions
    roles:
    - OWN
    - CUS
    - DQL
    - CAT
    - MIG
    - ARC
    refs:
    - RB-LEGACY
    - RB-TECHDEBT
    - RB-RETIRE
    - RB-TNA
    cr:
    - CR-26
    - CR-15
    prov: O
  - id: CH-05
    title: Target legacy where it blocks outcomes and widens inequalities
    icon: target
    mode: Both
    stage: plan
    why: Where poor or locked-in data delays access to services, the people most affected are often those already disadvantaged.
    actions:
    - Score each critical asset on legacy risk, quality, reuse value and impact on outcomes.
    - Check whether gaps or errors fall harder on some groups, using the equality duty.
    - Fund fixes first where risk, value and inequality overlap.
    - Report the choice and its reasons to the data governance board.
    evidence:
    - Prioritised asset heatmap
    - Equality analysis
    roles:
    - CDO
    - BRD
    - OWN
    refs:
    - RB-PSED
    - RB-LEGACY
    - RB-DMAF
    cr:
    - CR-02
    - CR-30
    - CR-26
    prov: O
  - id: CH-06
    title: Build DAM into contracts
    icon: handshake
    mode: Both
    stage: discover
    why: Suppliers often hold or process critical assets; without contract terms the owner cannot meet the policy.
    actions:
    - State who owns the data and its metadata.
    - Require metadata in an agreed format and quality reporting against the DQAP.
    - Set data return, format and deletion terms for exit.
    - Include data protection terms from the procurement policy note.
    evidence:
    - Contract schedule for data
    - Exit plan
    roles:
    - OWN
    - COO
    - CML
    refs:
    - RB-SOURCING
    - RB-DDATPB
    - RB-PPN020
    cr:
    - CR-20
    prov: O
  - id: CH-07
    title: Manage data asset risk on the same registers
    icon: shield-check
    mode: Both
    stage: live
    why: The policy relies on risk controls; separate data risk lists are easy to ignore.
    actions:
    - Record risks to critical assets on the corporate or programme register.
    - Link each to the asset, its owner and the senior information risk owner.
    - Review alongside DQAP results each quarter.
    evidence:
    - Risk register entries
    - Quarterly review notes
    roles:
    - OWN
    - BRD
    - PDM
    refs:
    - RB-ORANGE
    - RB-GSC
    cr:
    - CR-19
    prov: O
  - id: CH-08
    title: Hand over to business as usual
    icon: arrow-right-left
    mode: Change
    stage: live
    why: Assets created by projects lose their owner when the project closes unless handover is planned.
    actions:
    - Confirm a named business-as-usual owner and steward before the project closes.
    - Hand over the DQAP, quality rules, runbook and open issues.
    - Use the ownership model's transition steps and set the next review date.
    evidence:
    - Signed handover note
    - Updated catalogue entry
    roles:
    - OWN
    - STW
    - COO
    - PDM
    - SVO
    refs:
    - RB-GOVS002
    cr:
    - CR-27
    prov: O
  - id: CH-09
    title: Plan people change, not just process change
    icon: users-round
    mode: Both
    stage: plan
    why: New duties fail when people are not told, trained, given time or recognised for them.
    actions:
    - 'Assess who is affected: owners, stewards, custodians, analysts, suppliers.'
    - Put data duties into role descriptions and objectives.
    - Train each role at the right level and give stewards protected time.
    - Communicate why the policy matters in terms of services and people, not compliance.
    evidence:
    - Change impact assessment
    - Training plan
    - Communications plan
    roles:
    - CDO
    - COO
    - SRO
    - PDM
    refs:
    - RB-SUCCESS
    - RB-DSFA
    - RB-DDAT
    cr:
    - CR-21
    - CR-22
    prov: O
  - id: CH-10
    title: Show the benefits
    icon: trending-up
    mode: Both
    stage: live
    why: Continued funding depends on evidence that the work changed something.
    actions:
    - Agree a few measures before starting, such as reuse requests met, duplicate collections stopped or time spent cleansing.
    - Take a baseline, then measure each year with the return.
    - Use proportionate evaluation methods.
    evidence:
    - Benefits map
    - Baseline and annual measures
    roles:
    - COO
    - DQL
    - PMO
    refs:
    - RB-MAGENTA
    cr:
    - CR-29
    - CR-04
    prov: O
  - id: CH-11
    title: Keep the yearly cycle running in business as usual
    icon: refresh-cw
    mode: BAU
    stage: live
    why: The policy is annual; without a calendar it becomes a scramble before each return.
    actions:
    - Set fixed dates for asset review, metadata updates, DQAP review and the board.
    - Track each owner's actions between returns.
    - Feed lessons into the next year's priorities.
    evidence:
    - Annual calendar
    - Action log
    roles:
    - COO
    - BRD
    refs: []
    cr:
    - CR-04
    - CR-03
    prov: O
  - id: CH-12
    title: Assess maturity and set a target
    icon: radar
    mode: BAU
    stage: plan
    why: A shared maturity measure turns the policy into a plan that can be resourced and tracked.
    actions:
    - Run the government data maturity assessment or use the self-assessment here as a first pass.
    - Set a target level for each DAM strand with dates.
    - Repeat every one to two years.
    evidence:
    - Assessment results
    - Target levels
    roles:
    - CDO
    - COO
    refs:
    - RB-DMAF
    - RB-DMAHUB
    cr:
    - CR-23
    prov: O
  - id: CH-13
    title: Share and reuse safely across organisations
    icon: share-2
    mode: Both
    stage: discover
    why: Reuse is the point of the policy, but it never removes legal duties or forces sharing.
    actions:
    - Check the catalogue for reusable assets before collecting new data.
    - Use the sharing framework and code for agreements.
    - Record sharing arrangements against the asset in the catalogue.
    evidence:
    - Data sharing agreements
    - Catalogue links
    roles:
    - OWN
    - DPO
    refs:
    - RB-DSGF
    - RB-ICOSHARE
    - RB-DEA
    cr:
    - CR-17
    - CR-28
    prov: O
  - id: CH-14
    title: Design out future legacy and lock-in
    icon: arrow-right-left
    mode: Change
    stage: alpha
    why: Systems bought or built today become tomorrow's legacy unless their data can be moved out without loss or delay.
    actions:
    - Require data in open, documented formats with a published schema.
    - Ask suppliers to show how a full export with metadata works before you sign.
    - Prefer open standards and APIs that follow the government API standards.
    - Record each system's exit route against its assets in the catalogue.
    evidence:
    - Exit and portability test results
    - Schema and API documentation
    roles:
    - CUS
    - CAT
    - OWN
    - ARC
    - CML
    refs:
    - RB-OPEN
    - RB-API
    - RB-CHOOSE
    - RB-TECHDEBT
    cr:
    - CR-32
    - CR-26
    prov: O
  - id: CH-15
    title: Prepare for a cyber incident affecting a critical asset
    icon: shield-check
    mode: BAU
    stage: live
    why: A ransomware attack or breach can corrupt or expose a critical asset; quality plans and owners must be ready.
    actions:
    - Mark critical data assets in the incident response plan and asset inventory.
    - Agree recovery point and recovery time with each data owner.
    - Test restoring an asset and check its quality afterwards against the DQAP rules.
    - Agree who tells data users when an asset may be affected.
    evidence:
    - Incident plan entries
    - Restore test and post-restore quality results
    roles:
    - OWN
    - CUS
    - DPO
    refs:
    - RB-NCSCIR
    - RB-CAF
    - RB-NCSC10
    - RB-GOVS007
    cr:
    - CR-31
    - CR-19
    prov: O
  - id: CH-16
    title: Use the buying routes and contract terms that protect data
    icon: handshake
    mode: Change
    stage: discover
    why: Most catalogue, quality and platform tools are bought; the route and terms decide who controls the data.
    actions:
    - Buy through an established framework where one fits, such as G-Cloud.
    - Use the model contract schedules for data, security and exit rather than supplier terms.
    - Make metadata delivery, quality reporting and data return measurable obligations with service credits.
    - Publish transparency information as the Procurement Act requires.
    evidence:
    - Procurement route decision
    - Contract data, security and exit schedules
    roles:
    - COO
    - OWN
    - CML
    refs:
    - RB-GCLOUD
    - RB-MSC
    - RB-MTC20
    - RB-PA23
    - RB-PA23G
    - RB-SOURCING
    cr:
    - CR-20
    - CR-32
    prov: O
  programme_roles:
    intro: Medium and large programmes bring in roles the DAM Policy and its guidance do not name. They decide most of what happens to critical data during change, so each needs explicit data responsibilities.
      This is this portal's assessment; the policy names only the chief data officer, data owners and the Chief Data Officer Council.
    rows:
    - role: SRO
      stages:
      - plan
      - live
      works_with:
      - OWN
      - CDO
      resp:
      - Make sure every critical asset in scope has an owner and a funded quality plan
      - Accept DAM checkpoints into the assurance plan
      - Sign off handover only when ownership, catalogue and DQAP transfer
      refs:
      - RB-SRO
      - RB-IAAP
    - role: PDM
      stages:
      - plan
      - discover
      - beta
      - live
      works_with:
      - OWN
      - COO
      - STW
      resp:
      - Put DAM activities in the plan, the risk register and gate criteria
      - Book data owners' time for decisions
      - Track data asset risks alongside other programme risks
      refs:
      - RB-GOVS002
    - role: SVO
      stages:
      - discover
      - alpha
      - beta
      - live
      works_with:
      - OWN
      - CAT
      - DQL
      resp:
      - Check the catalogue before collecting new data
      - Design validation from the quality rules
      - Show DAM evidence at service assessments
      refs:
      - RB-SMROLES
      - RB-SVCASSESS
    - role: ARC
      stages:
      - alpha
      - beta
      works_with:
      - CUS
      - CAT
      - STW
      resp:
      - Approve data models against agreed standards and identifiers
      - Require documented schemas, open formats and an exit route
      - Make metadata harvestable from new platforms
      refs:
      - RB-TCOP
      - RB-API
      - RB-OPEN
    - role: MIG
      stages:
      - beta
      - retire
      works_with:
      - OWN
      - DQL
      - CAT
      - CUS
      resp:
      - Profile quality before migration and reconcile after
      - Keep catalogue entries and ownership in step as assets move
      - Record lineage from old to new systems
      refs:
      - RB-LEGACY
      - RB-RETIRE
    - role: CML
      stages:
      - plan
      - discover
      - retire
      works_with:
      - OWN
      - DPO
      - COO
      resp:
      - Write data ownership, metadata, quality reporting and exit into contracts
      - Use model contract data and exit schedules
      - Track contract end dates against the assets they touch
      refs:
      - RB-MSC
      - RB-SOURCING
      - RB-PPN020
    - role: PMO
      stages:
      - plan
      - beta
      - live
      works_with:
      - COO
      - BRD
      resp:
      - Check DAM checkpoints at each gate
      - Report data asset readiness to the senior responsible owner
      - Feed lessons into the next programme
      refs:
      - RB-IAAP
      - RB-NISTA
    blueprint:
    - stage: plan
      user: Programme board agrees scope and business case
      front: Business case names critical assets and costs DAM work
      back: Asset list drawn from the catalogue; risks added to the register
      data: Data owners and the chief data officer agree priorities
      support: Assurance plan includes DAM checkpoints
    - stage: discover
      user: Team explores needs and existing data
      front: Catalogue search before new collection
      back: Contracts and data sharing options reviewed
      data: Owners confirmed for each asset in scope
      support: Commercial lead brings data clauses into the route to market
    - stage: alpha
      user: Team designs and tests options
      front: Data model and quality rules designed together
      back: Schemas, identifiers and exit route approved by design authority
      data: Stewards agree definitions and targets
      support: DPIA started where personal data is involved
    - stage: beta
      user: Team builds, migrates and goes live
      front: New assets catalogued; validation built from rules
      back: Migration profiled and reconciled; lineage recorded
      data: Owners sign off quality against targets
      support: Gate review checks DAM evidence
    - stage: live
      user: Service runs; programme closes
      front: Quality published to users
      back: DQAP, runbook and contracts handed over
      data: Business-as-usual owner and steward named
      support: Asset included in the next annual return
    - stage: retire
      user: Old systems are switched off
      front: Users told what happens to their data
      back: Assets migrated, archived or disposed of under records rules
      data: Catalogue entries updated or closed
      support: Records transferred where the Public Records Act applies
testing:
  intro: This portal is ready for early testing with people who will use it. We want to know whether you can find what you need, understand it and act on it. It takes about 20 minutes. Choose the tasks
    closest to your role; you do not need to do them all.
  feedback_form: testing.yml
  tasks:
  - id: T-01
    roles:
    - all
    title: Find what the DAM Policy requires of your organisation
    start: dam.html
    done: You can name two 'must' requirements and the step that meets each one.
  - id: T-02
    roles:
    - cdo
    - coo
    title: Assess your organisation's maturity and download the result
    start: capability-model.html#cm-self
    done: You have a radar profile and a downloaded CSV file.
  - id: T-03
    roles:
    - cdo
    - coo
    title: Find what to build into a programme business case and its assurance plan
    start: change.html#practices
    done: You can list the actions for business cases and for assurance.
  - id: T-04
    roles:
    - own
    title: Find what a data owner is accountable for and what happens when you move role
    start: personas.html#persona-own
    done: You know your duties and the steps to hand over ownership.
  - id: T-05
    roles:
    - stw
    - dql
    title: Find which sector supplements apply to an adult social care asset and download its quality rules
    start: sectors.html#which
    done: You have the social care supplement open and its rules file downloaded.
  - id: T-06
    roles:
    - cat
    title: Find the metadata you must record, and the extra fields for geospatial data
    start: cataloguing.html#metadata
    done: You can list the 'must' properties and two extra geospatial fields.
  - id: T-07
    roles:
    - dql
    - stw
    title: Set a target and performance bands for a data quality rule
    start: quality.html#method
    done: You can say what target and bands you would set, and why.
  - id: T-08
    roles:
    - all
    title: Find a learning route and the career pathway closest to your job
    start: professions.html#pf-route
    done: You have marked at least one learning resource as done.
  - id: T-09
    roles:
    - all
    title: Look up what 'data steward' means and where stewards appear in the methods
    start: knowledge.html
    done: You found the definition and one step that names the steward.
  - id: T-11
    roles:
    - all
    title: Find what your own team, such as digital, cyber, technology or commercial, should ask and do
    start: perspectives.html
    done: You can name two questions and one action for your team's lens.
  - id: T-12
    roles:
    - prg
    title: Find the data responsibilities of a senior responsible owner and what to check at each programme stage
    start: change.html#programme-roles
    done: You can name three responsibilities and the stage each belongs to.
  - id: T-13
    roles:
    - all
    title: Use the DAMA wheel to see which knowledge areas your role shapes, and one way records management overlaps
    start: capability-model.html#cm-dama
    done: You chose your role and can name two areas and one records counterpart.
  - id: T-14
    roles:
    - all
    title: Pick two recommendations for working with other professions and a community to join
    start: community.html
    done: You marked two recommendations and opened one community page.
  - id: T-10
    roles:
    - all
    title: Change the text size and colours, then move around using only the keyboard
    start: index.html
    done: You reached a playbook step without a mouse, with your display settings kept.
lenses:
  intro: The DAM Policy is written from a data point of view, but delivering it depends on digital, cyber, technology and commercial teams. Each lens below says what the policy means for that community,
    what they should ask and do for each capability, and where this portal and the rulebook help.
  caps_order:
  - gov
  - cat
  - dq
  items:
  - id: L-DATA
    name: Data
    icon: database
    profs:
    - PR-DD
    - PR-AF
    - PR-KIM
    cover_before:
      gov: Strong
      cat: Strong
      dq: Strong
    cover_now:
      gov: Strong
      cat: Strong
      dq: Strong
    means: 'The policy''s home lens: identify, describe, own and improve critical data assets, and report them.'
    questions:
    - Which of our assets are critical, and do we agree why?
    - Can someone outside our team find, understand and trust each asset from its catalogue entry?
    - Who decides what good enough means for each asset?
    actions:
      gov:
      - Name an owner and steward for every critical asset.
      - Run a data governance board that records decisions.
      cat:
      - Record the core metadata in a catalogue and report it to GDS.
      - Use the cross-government Metadata Exchange Model terms.
      dq:
      - Write a DQAP for every asset and log issues with priorities.
      - Publish quality statements users can read.
    pitfalls:
    - Treating the return as the goal rather than better-managed data.
    - Describing assets nobody owns.
    cr:
    - CR-05
    - CR-06
    - CR-07
    - CR-08
    ch:
    - CH-11
    - CH-12
    refs:
    - RB-DMAF
    - RB-AIREADY
    gap: Covered across the three playbooks, the capability model and the sector supplements.
  - id: L-DIGI
    name: Digital and service
    icon: layers
    profs:
    - PR-DD
    cover_before:
      gov: Partial
      cat: Partial
      dq: Partial
    cover_now:
      gov: Strong
      cat: Strong
      dq: Strong
    means: Services create, change and consume critical data. Service teams decide what is collected, how it is validated and what users see.
    questions:
    - Which critical assets does our service create or depend on?
    - Do our forms and validation stop bad data at the point of collection?
    - Are data services such as APIs documented, catalogued and owned like the data behind them?
    actions:
      gov:
      - Name the data owner as a stakeholder of the service from discovery.
      - Show DAM evidence at service assessments.
      cat:
      - Catalogue data services and APIs alongside the data sets they expose.
      - Publish API documentation that follows the government API standards.
      dq:
      - Turn quality rules into form validation and API contract tests.
      - Design forms so people can describe themselves accurately.
    pitfalls:
    - Collecting data the catalogue shows another service already holds.
    - Treating an API as technical plumbing with no owner.
    cr:
    - CR-12
    - CR-22
    - CR-25
    ch:
    - CH-02
    - CH-13
    refs:
    - RB-SVC
    - RB-SVCASSESS
    - RB-API
    - RB-RETIRE
    gap: Strengthened in 1.6 with data service and API actions; user research with service teams is still to do (OR-04).
  - id: L-CYBER
    name: Cyber and security
    icon: shield-check
    profs:
    - PR-CYB
    - PR-SEC
    cover_before:
      gov: Partial
      cat: Gap
      dq: Gap
    cover_now:
      gov: Strong
      cat: Partial
      dq: Partial
    means: Critical data assets are among the things most worth protecting. Security teams need to know which they are, and data teams need to know an asset can be recovered and trusted after an incident.
    questions:
    - Do our asset inventory and incident plans include every critical data asset?
    - What is the recovery point and recovery time for each one, and who agreed it?
    - After a restore, how do we know the data is complete and correct?
    actions:
      gov:
      - Link each critical asset to its CAF outcomes and to the SIRO's risk register.
      - Agree recovery objectives with each data owner.
      cat:
      - Record classification, handling caveats and access rights accurately; scope depends on them.
      - Keep the catalogue itself access-controlled where entries reveal sensitive holdings.
      dq:
      - After any restore or suspected tampering, rerun the DQAP rules before the asset is used again.
      - Treat unexplained quality drops as a possible security signal.
    pitfalls:
    - Assuming OFFICIAL means low risk; aggregation can raise sensitivity.
    - A catalogue that becomes a map for attackers.
    cr:
    - CR-16
    - CR-19
    - CR-31
    ch:
    - CH-07
    - CH-15
    refs:
    - RB-CAF
    - RB-GCSS
    - RB-GOVS007
    - RB-SBD
    - RB-NCSC10
    - RB-NCSCIR
    - RB-GSC
    gap: Was the thinnest lens. 1.6 adds a cyber resilience capability, an incident practice and seven verified security sources. Needs review by a security professional.
  - id: L-TECH
    name: Technology and architecture
    icon: server
    profs:
    - PR-DD
    cover_before:
      gov: Partial
      cat: Partial
      dq: Partial
    cover_now:
      gov: Strong
      cat: Strong
      dq: Strong
    means: Platforms, integration and tooling decide whether critical data can be found, joined, checked and moved. Architecture choices made now set the cost of the next migration.
    questions:
    - Which systems and platforms hold each critical asset?
    - Can metadata be harvested automatically rather than typed in?
    - Are quality checks automated in the pipeline, or done by hand?
    actions:
      gov:
      - Record the system of record and data platform for each asset.
      - Apply the Technology Code of Practice and Cloud First when assets move.
      cat:
      - Harvest metadata from platforms into the catalogue using DCAT and the Metadata Exchange Model.
      - Expose catalogue entries through an API so central discovery services can collect them.
      dq:
      - Run quality rules automatically in data pipelines and publish results.
      - Version schemas and test changes against the DQAP rules before release.
    pitfalls:
    - Buying a catalogue tool before agreeing ownership and metadata.
    - Bespoke integrations that only one supplier understands.
    cr:
    - CR-11
    - CR-12
    - CR-13
    - CR-14
    ch:
    - CH-04
    - CH-14
    refs:
    - RB-TCOP
    - RB-CLOUD
    - RB-API
    - RB-REFARCH
    - RB-OPEN
    - RB-NCSCCLOUD
    gap: Strengthened in 1.6 with architecture, platform and automation actions and verified sources.
  - id: L-COMM
    name: Commercial and suppliers
    icon: handshake
    profs:
    - PR-COM
    - PR-PD
    cover_before:
      gov: Partial
      cat: Gap
      dq: Gap
    cover_now:
      gov: Strong
      cat: Partial
      dq: Partial
    means: Many critical assets are held or processed by suppliers, and most tools are bought. Contracts decide who owns the data, what metadata and quality evidence the supplier must provide, and whether
      the data can leave.
    questions:
    - Which critical assets are held or processed by a supplier?
    - Does each contract name the data owner and require metadata, quality reporting and full data return?
    - When does each contract end, and is the exit plan tested?
    actions:
      gov:
      - Map contracts to the critical assets they touch, with end dates.
      - Use model contract schedules for data, security and exit.
      cat:
      - Make catalogue-ready metadata a contract deliverable, in the government's terms.
      - Require suppliers to keep catalogue entries current when they change the data.
      dq:
      - Turn DQAP targets into service levels with credits.
      - Require suppliers to report quality against the agreed rules.
    pitfalls:
    - Supplier terms that treat government data as the supplier's product.
    - Exit plans that are never tested until the contract ends.
    cr:
    - CR-20
    - CR-24
    - CR-32
    ch:
    - CH-06
    - CH-16
    - CH-01
    refs:
    - RB-SOURCING
    - RB-DDATPB
    - RB-MSC
    - RB-MTC20
    - RB-PPN020
    - RB-PA23
    - RB-PA23G
    - RB-GCLOUD
    - RB-SPEND
    gap: Was thin, with one practice. 1.6 adds a buying-routes practice and verified commercial sources. Needs review by a commercial professional.
  - id: L-LEGACY
    name: Legacy and technical debt
    icon: construction
    profs:
    - PR-DD
    - PR-PD
    cover_before:
      gov: Partial
      cat: Partial
      dq: Partial
    cover_now:
      gov: Strong
      cat: Strong
      dq: Strong
    means: Legacy systems concentrate critical data that is hard to find, understand or trust, and that blocks better services. Getting data out safely, and not creating the next legacy, are both DAM work.
    questions:
    - Where are our largest concentrations of critical data in legacy systems?
    - Which of them block outcomes for the people who most need services?
    - What will stop the replacement becoming legacy in its turn?
    actions:
      gov:
      - Prioritise exits where legacy risk, value and inequality overlap.
      - Keep ownership in step as assets migrate.
      cat:
      - Start every exit from the data asset register, as the legacy guidance asks.
      - Record schemas and lineage before the old system goes.
      dq:
      - Profile quality before migration and reconcile counts, totals and keys after.
      - Use migration as the moment to fix root causes, not copy them.
    pitfalls:
    - Migrating data without its meaning or quality history.
    - Replacing one closed system with another.
    cr:
    - CR-26
    - CR-32
    - CR-15
    ch:
    - CH-04
    - CH-05
    - CH-14
    refs:
    - RB-LEGACY
    - RB-TECHDEBT
    - RB-RETIRE
    - RB-TNA
    - RB-OPEN
    gap: Covered by the delivery and change practices; 1.6 adds future-legacy prevention.
dama:
  intro: The Data Management Body of Knowledge (DAMA-DMBOK) arranges data management as knowledge areas around data governance. This view places the DAM Policy, the capability model and the government maturity
    model on that wheel, so each role can see which areas it shapes and how the policy fits a wider enterprise data management capability.
  hub: DM-GOV
  areas:
  - id: DM-GOV
    name: Data governance
    dmbok: Data governance
    desc: Decision rights, accountability and policy for data across the organisation.
    im: Information governance and the information asset owner role.
    uses:
      cdo: Set the mandate and board; hold owners to account
      coo: Run the governance cycle and the return
      own: Make and record decisions for your assets
      stw: Prepare decisions and keep definitions agreed
      cat: Apply governance decisions in the catalogue
      dql: Escalate quality risks to owners
      prg: Bring programme decisions into the governance cycle
    dam: []
  - id: DM-ARC
    name: Data architecture
    dmbok: Data architecture
    desc: 'The blueprint of data across the organisation: where data lives, how it flows and which source is authoritative.'
    im: Information architecture and file plans.
    uses:
      cdo: Sponsor a target data architecture
      coo: Use it to find candidate assets
      own: Agree the authoritative source for your data
      stw: Map flows and dependencies
      cat: Link catalogue entries to systems
      dql: Trace quality problems to where data enters
      prg: Approve designs against it
    dam: []
  - id: DM-MOD
    name: Data modelling and design
    dmbok: Data modelling and design
    desc: Defining the structure, meaning and relationships of data.
    im: Records classification schemes.
    uses:
      cdo: Expect agreed definitions for critical assets
      coo: Collect definitions for the return
      own: Approve the meaning of key data items
      stw: Maintain definitions and the glossary
      cat: Publish schemas with entries
      dql: Write rules from the model
      prg: Require documented models from suppliers
    dam: []
  - id: DM-OPS
    name: Data storage and operations
    dmbok: Data storage and operations
    desc: 'Running the platforms that store data: backup, recovery, performance and retention.'
    im: Storage, preservation and disposal of records.
    uses:
      cdo: Fund resilient platforms for critical data
      coo: Know which platform holds each asset
      own: Agree recovery objectives
      stw: Check retention is applied
      cat: Record system of record and location
      dql: Check data after restore
      prg: Plan platform moves and decommissioning
    dam: []
  - id: DM-SEC
    name: Data security
    dmbok: Data security
    desc: Protecting data from unauthorised access, change and loss, in line with classification.
    im: Protective marking and access to records.
    uses:
      cdo: Link critical assets to cyber risk
      coo: Confirm classification is right before reporting
      own: Accept residual risk for your assets
      stw: Apply handling rules
      cat: Record classification and access rights
      dql: Treat odd quality drops as security signals
      prg: Build security in from the start
    dam: []
  - id: DM-INT
    name: Data integration and interoperability
    dmbok: Data integration and interoperability
    desc: Moving and joining data between systems and organisations using shared standards.
    im: Records exchange and transfer formats.
    uses:
      cdo: Back open standards and shared identifiers
      coo: Track sharing arrangements
      own: Approve sharing of your data
      stw: Map data to shared standards
      cat: Catalogue APIs and data services
      dql: Check data after each integration
      prg: Avoid bespoke, closed integrations
    dam: []
  - id: DM-DOC
    name: Document and content management
    dmbok: Document and content management
    desc: 'Managing unstructured information: documents, content and records.'
    im: 'The core of records management: capture, classification, retention and disposal.'
    uses:
      cdo: Align data and records strategies
      coo: Reconcile the asset register with the information asset register
      own: Own records and data consistently
      stw: Apply retention schedules
      cat: Record retention and disposal in entries
      dql: Check documents behind key data items
      prg: Plan records transfer when systems retire
    dam: []
  - id: DM-REF
    name: Reference and master data
    dmbok: Reference and master data
    desc: Agreeing and maintaining the shared, authoritative versions of key entities and code lists.
    im: Authority files and controlled vocabularies.
    uses:
      cdo: Sponsor shared reference data
      coo: Spot duplicate assets
      own: Own the master version of key entities
      stw: Maintain code lists and identifiers
      cat: Link assets that share reference data
      dql: Check codes against the reference list
      prg: Reuse existing reference data, do not copy it
    dam: []
  - id: DM-BI
    name: Data warehousing and business intelligence
    dmbok: Data warehousing and business intelligence
    desc: Bringing data together for analysis, reporting and decisions.
    im: Retention of reports and derived records.
    uses:
      cdo: Use quality statements in decisions
      coo: Report progress from catalogue data
      own: Know where your data is reused
      stw: Record derived data sets
      cat: Catalogue analytical products that are critical
      dql: Publish quality alongside reports
      prg: Plan reporting needs early
    dam: []
  - id: DM-META
    name: Metadata management
    dmbok: Metadata management
    desc: Describing data so people and machines can find, understand and trust it.
    im: Records metadata (ISO 23081) and the information asset register.
    uses:
      cdo: Require complete metadata for the return
      coo: Build the return from catalogue records
      own: Approve entries for your assets
      stw: Keep descriptions accurate
      cat: Run the catalogue and harvest metadata
      dql: Record quality metadata
      prg: Make metadata a delivery output
    dam: []
  - id: DM-DQ
    name: Data quality
    dmbok: Data quality
    desc: Defining, measuring and improving how fit data is for its purposes.
    im: Integrity and authenticity of records.
    uses:
      cdo: Fund fixes where quality blocks outcomes
      coo: Collate DQAP status
      own: Set targets and accept risks
      stw: Run checks and log issues
      cat: Show quality in entries
      dql: Run the DQAP
      prg: Profile and reconcile in migrations
    dam: []
  lifecycle:
  - data: Plan and design
    records: Plan what records are needed
    dam: Identify critical assets; design metadata and rules
    who: Owner, architect, records manager
  - data: Acquire or create
    records: Create and capture
    dam: Validate at collection; catalogue on creation
    who: Service owner, steward
  - data: Store and secure
    records: Store and protect
    dam: Record classification, location and recovery objectives
    who: Custodian, security
  - data: Use and share
    records: Use and provide access
    dam: Publish quality; record sharing arrangements
    who: Owner, data protection officer
  - data: Maintain and improve
    records: Review and update
    dam: Annual review of entries and DQAP
    who: Steward, data quality lead
  - data: Archive or dispose
    records: Appraise, transfer or destroy
    dam: Close or update entries; transfer where the Public Records Act applies
    who: Records manager, owner
  im_refs:
  - RB-TNA
  - RB-TNAIM
  - RB-TNATRANS
  - RB-PRA
  - RB-ISO15489
  - RB-ISO23081
  - RB-KIM
  - RB-PKSB
joinup:
  intro: Data asset management needs data, records and information, security, digital, technology, analysis, commercial and delivery professionals to act on the same assets. These recommendations turn that
    into shared artefacts, routines and networks, each with a tangible outcome you can check.
  recs:
  - id: J-01
    title: Keep one register of assets
    action: Reconcile the critical data asset list with the information asset register so each asset has one record, with the data owner and information asset owner linked.
    who:
    - COO
    - IAO
    - CAT
    outcome: One list used by data, records and security teams; no asset is reported twice or missed.
    measure: 'Assets on both lists without a shared identifier: zero.'
  - id: J-02
    title: Use one glossary
    action: Publish one organisation glossary for data, records and security terms, linked to the cross-government vocabulary, and point catalogue entries to it.
    who:
    - STW
    - CAT
    outcome: The same word means the same thing in a catalogue entry, a file plan and a risk register.
    measure: Critical assets whose key items link to glossary terms.
  - id: J-03
    title: Run one board for data, information and security risk
    action: Bring the data governance board, information assurance and the senior information risk owner together, quarterly, with one agenda covering critical assets.
    who:
    - CDO
    - BRD
    - IAO
    outcome: Decisions on an asset consider data, records and security together.
    measure: Decisions recorded per quarter that cite more than one discipline.
  - id: J-04
    title: Put DAM checkpoints in every programme
    action: Agree with the programme office a standard set of DAM checks for business cases, gates and handover, and give programmes a named data contact.
    who:
    - CDO
    - PMO
    - SRO
    outcome: Programmes stop creating unowned, uncatalogued assets.
    measure: Programmes closing with every in-scope asset owned, catalogued and quality-planned.
  - id: J-05
    title: Align retention with the data life cycle
    action: Map retention schedules to critical assets and record retention and disposal in catalogue entries.
    who:
    - IAO
    - CAT
    - OWN
    outcome: Data is kept as long as needed and no longer, with evidence.
    measure: Critical assets with a recorded retention rule.
  - id: J-06
    title: Learn together
    action: Run a shared induction for owners, stewards, information asset owners and programme leads, using the recommended curriculum and this portal's modules.
    who:
    - CDO
    - COO
    outcome: People in different professions use the same method and language.
    measure: Owners and stewards who completed the shared induction.
  - id: J-07
    title: Join the right communities
    action: Give each role one community to join and one to watch, from the list on this page, and share what you learn at the board.
    who:
    - COO
    - STW
    - DQL
    - CAT
    outcome: Practice spreads across organisations instead of being reinvented.
    measure: Roles with a named community; lessons shared per quarter.
  - id: J-08
    title: Rehearse an incident together
    action: Run a joint exercise where a critical asset is corrupted or exposed, involving security, records, data quality and the owner.
    who:
    - OWN
    - CUS
    - DQL
    - DPO
    outcome: Everyone knows their part in recovering and re-trusting an asset.
    measure: Critical assets covered by a tested recovery and quality check.
  - id: J-09
    title: Share contract clauses
    action: Keep a shared library of data, metadata, quality and exit clauses with the commercial team and reuse it in every relevant procurement.
    who:
    - CML
    - OWN
    - DPO
    outcome: Suppliers face the same data obligations everywhere.
    measure: New contracts touching critical assets that use the shared clauses.
  - id: J-10
    title: Report one set of measures
    action: Combine catalogue completeness, DQAP status, records compliance and security assurance for critical assets into one quarterly view.
    who:
    - COO
    - BRD
    outcome: Leaders see one picture of how well critical assets are managed.
    measure: Quarterly view produced and discussed at the board.
