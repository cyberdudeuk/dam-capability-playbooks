  profs:
  - id: PR-DD
    name: Government Digital and Data Profession
    icon: database
    rb: RB-DDAT
    aligned: Digital and data function
    why: Home of the data governance manager, data architect, analyst, engineer and chief data officer roles.
  - id: PR-AF
    name: Analysis Function (statistics, economics, social and operational research, geography, actuaries)
    icon: chart-line
    rb: RB-AFROLES
    aligned: Analysis function
    why: Analysts who own and assure data for statistics, evidence and evaluation.
  - id: PR-KIM
    name: Knowledge and Information Management
    icon: book-marked
    rb: RB-KIM
    aligned: Specialist profession
    why: Records, information assets, metadata and information asset owner support.
  - id: PR-SEC
    name: Government Security Profession
    icon: lock-keyhole
    rb: RB-SECPROF
    aligned: Security function
    why: Classification, protective controls and support to the senior information risk owner.
  - id: PR-CYB
    name: Government Cyber Profession
    icon: shield-check
    rb: RB-CYBERPROF
    aligned: Digital function
    why: Technical security of the systems that hold critical assets.
  - id: PR-PD
    name: Project Delivery
    icon: workflow
    rb: RB-GOVS002
    aligned: Project delivery function
    why: Senior responsible owners and programme teams who create, migrate and retire data assets.
  - id: PR-OWNPROF
    name: The data owner's own profession (for example policy, operational delivery or finance)
    icon: users-round
    rb: RB-PROFS
    aligned: Any
    why: Data owners are usually business leaders, not data specialists; the ownership model lists the skills they need.
  - id: PR-COM
    name: Government Commercial Function
    icon: handshake
    rb: RB-COMMFN
    aligned: Commercial and grants function
    why: Commercial specialists who set the contract terms for data ownership, metadata, quality and exit.
