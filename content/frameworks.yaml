    - {portal: cat, title: Legacy and technical debt, path: '#legacy', why: Evidence of legacy in an organisation's public code, to plan exits from.}
    - {portal: dqc, title: Data debt and migration, path: legacy.html, why: Data quality gates to carry through a modernisation programme.}
    - {portal: dqc, title: Data quality in change programmes, path: 'roles.html#change', why: 'Gate questions, a RACI and a service blueprint for data quality during delivery.'}
    capability-model:
    - {portal: cat, title: Data management wheel, path: '#dama', why: Public code projects with evidence of each DAMA knowledge area.}
    - {portal: dqc, title: Data quality capability model, path: models.html, why: The data quality capability in more detail, with workflows and downloads.}
    - {portal: dqc, title: Data management wheel (Commons), path: wheel.html, why: 'The same eleven areas from a data quality angle, shaded by your own maturity answers.'}
