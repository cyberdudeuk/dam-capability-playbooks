  themes:
  - name: Uses
    gloss: 'Getting value from data: decisions, evidence of impact, better services.'
  - name: Data
    gloss: 'The technical side of managing data: assets, collection, quality, interoperability.'
  - name: Leadership
    gloss: 'How senior and business leaders engage with data: strategy, responsibility, oversight, investment.'
  - name: Culture
    gloss: 'Attitudes to data across the organisation: awareness, openness, security.'
  - name: Tools
    gloss: The systems and tools used to store, share and work with data.
  - name: Skills
    gloss: The data skills and knowledge of staff at every level.
  levels:
  - Beginning
  - Emerging
  - Learning
  - Developing
  - Mastering
  level_anchors:
  - level-1-beginning
  - level-2-emerging
  - level-3-learning
  - level-4-developing
  - level-5-mastering
  strands:
  - id: own
    name: Ownership and governance
    icon: key-round
    cr:
    - CR-01
    - CR-07
    dma:
    - 10
    - 9
    levels:
    - Few assets have a named owner; decisions about data are made by whoever holds it.
    - Owners named for some critical assets, often by job title only; no regular review.
    - Every reported critical asset has a named owner who knows the role; a board meets and records decisions.
    - Owners review their assets each year, escalate risks and are covered when people move; ownership is in objectives.
    - Ownership is routine across the organisation and its bodies; owners shape investment and sharing decisions.
  - id: cat
    name: Cataloguing and reporting
    icon: library-big
    cr:
    - CR-05
    - CR-06
    - CR-03
    dma:
    - 4
    levels:
    - No list of critical assets; knowledge sits with individuals.
    - A spreadsheet of assets exists, with gaps in the core metadata.
    - All in-scope assets are in a catalogue with the core metadata and reported to GDS on time.
    - Metadata is machine-readable, checked automatically and updated when assets change; arm's length body returns are assured.
    - The catalogue is the first place people look; metadata flows to central discovery services without rework.
  - id: dq
    name: Quality management
    icon: gauge
    cr:
    - CR-08
    - CR-09
    dma:
    - 7
    levels:
    - Quality problems are found by users and fixed one by one.
    - Some rules exist for some assets; quality is measured occasionally.
    - Every critical asset has a DQAP covering all 7 steps, with targets and an issue log.
    - Checks run automatically, root causes are fixed upstream and results are published to users.
    - Quality is designed in at collection; trends drive investment and prevent new issues.
  - id: chg
    name: Change and investment
    icon: workflow
    cr:
    - CR-24
    - CR-25
    - CR-26
    dma:
    - 3
    - 9
    levels:
    - Projects create and retire data without telling anyone responsible for it.
    - Some programmes ask about data at business case stage, inconsistently.
    - Business cases, spend control and service assessments ask for DAM evidence; migrations reconcile data.
    - Assurance plans include DAM checkpoints; benefits are tracked; legacy exits start from the asset register.
    - Portfolio choices are driven by data asset risk and value, including effects on outcomes for different groups.
  crosswalk:
  - level: Beginning
    cmmi: Initial
    iso8000: Processes performed ad hoc
    note: Little defined practice.
  - level: Emerging
    cmmi: Managed
    iso8000: Processes performed and managed in places
    note: Practice depends on individuals.
  - level: Learning
    cmmi: Defined
    iso8000: Processes defined and repeatable
    note: The DAM Policy minimum sits around here for critical assets.
  - level: Developing
    cmmi: Quantitatively managed
    iso8000: Processes measured
    note: Measures drive decisions.
  - level: Mastering
    cmmi: Optimising
    iso8000: Processes continually improved
    note: Improvement is systematic.
