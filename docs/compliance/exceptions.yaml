    item: "security contact email"
    rationale: "Owner decision (3 November 2026): no email address is published on any artefact; contact is by form only. Security reports go privately through GitHub private vulnerability reporting (switched on), as SECURITY.md explains. This departs from the GDS Way rule to give an email address for security reports."
    reviewed: 2026-11-27
    reference: SECURITY.md
